name: Install sedori v21

on:
  push:
    branches: [main]
    paths:
      - '.github/v21.part*'

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild complete index.html
        shell: bash
        run: |
          cat .github/v21.part* > /tmp/v21.b64
          base64 -d /tmp/v21.b64 > /tmp/v21.bz2
          bunzip2 -c /tmp/v21.bz2 > index.html
          rm -f .github/v21.part*
          grep -q '<!DOCTYPE html>' index.html
          grep -q '</html>' index.html
          grep -q 'schema v21' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/v21.part* || true
          git commit -m 'Update sedori to v21 shared Drive sync'
          git push
