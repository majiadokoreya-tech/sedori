<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>せどり管理</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#17172a;--muted:#7f8193;--border:#e4e6ef;--accent:#ff4d6d;--green:#00a878;--orange:#f0a500;--blue:#3f7ee8;--red:#e94b5f;--purple:#7b61ff;--shadow:0 5px 18px rgba(20,20,40,.07);--radius:18px}*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);padding-bottom:94px;font-size:15px}header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;justify-content:space-between}h1{font-size:1.22rem;font-weight:950}h1 span{color:var(--accent)}.header-mini{font-size:.75rem;color:var(--muted);font-weight:850;text-align:right;line-height:1.5}.tabs{position:sticky;top:57px;z-index:19;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-bottom:1px solid var(--border)}.tab{border:none;background:#fff;color:var(--muted);font-weight:950;font-size:.78rem;padding:12px 2px;border-bottom:4px solid transparent}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}.page{display:none;padding:12px}.page.active{display:block}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}.section-title{font-size:.9rem;color:var(--muted);font-weight:950;letter-spacing:.03em;margin-bottom:11px;display:flex;justify-content:space-between;align-items:center}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.summary-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:13px;box-shadow:var(--shadow);position:relative;min-height:91px;cursor:pointer}.summary-card:active{transform:scale(.99)}.summary-card .label{font-size:.73rem;color:var(--muted);font-weight:900}.summary-card .value{font-size:1.22rem;font-weight:950;margin-top:4px;font-variant-numeric:tabular-nums}.summary-card .hint{font-size:.68rem;color:var(--muted);margin-top:8px}.summary-card .mini-btn{position:absolute;right:10px;top:10px;background:#fff0f4;color:var(--accent);border-radius:999px;padding:3px 8px;font-size:.65rem;font-weight:950}.green{color:var(--green)}.orange{color:var(--orange)}.blue{color:var(--blue)}.red{color:var(--red)}.purple{color:var(--purple)}.muted{color:var(--muted)}.mode-toggle{display:flex;gap:4px;background:#eef0f6;border:1px solid var(--border);padding:4px;border-radius:15px;margin-bottom:11px}.mode-toggle button{flex:1;border:none;background:transparent;border-radius:11px;padding:10px 4px;font-weight:950;color:var(--muted)}.mode-toggle button.active{background:var(--accent);color:#fff}label{display:block;font-size:.74rem;color:var(--muted);font-weight:900;margin:0 0 5px 2px}input,select,textarea{width:100%;border:1px solid var(--border);background:#f8f9fc;border-radius:12px;padding:11px;font-size:16px;font-family:inherit;color:var(--text)}textarea{min-height:70px;resize:vertical}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:#fff}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:11px}.form-row.single{grid-template-columns:1fr}.btn{border:none;border-radius:13px;padding:12px 13px;font-weight:950;font-family:inherit;font-size:.92rem}.btn-primary{background:var(--accent);color:#fff}.btn-green{background:var(--green);color:#fff}.btn-blue{background:var(--blue);color:#fff}.btn-ghost{background:#f3f4f8;color:var(--text);border:1px solid var(--border)}.btn-danger{background:#fff0f2;color:var(--red);border:1px solid #ffd2d8}.btn-sm{padding:7px 10px;font-size:.76rem;border-radius:10px}.quick-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}.quick-row button{white-space:nowrap}.filter-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filter-bar .wide{grid-column:1/3}.item-list{display:flex;flex-direction:column;gap:9px}.item{background:#fff;border:1px solid var(--border);border-radius:16px;padding:13px;box-shadow:var(--shadow)}.item-top{display:flex;justify-content:space-between;gap:10px}.item-name{font-weight:950;line-height:1.35}.badge{display:inline-block;font-size:.69rem;font-weight:950;border-radius:999px;padding:3px 8px;background:#f1f2f7;color:var(--muted);margin:5px 4px 0 0}.badge.sold{background:#e9fff7;color:var(--green)}.badge.unsold{background:#fff4df;color:#b37500}.badge.shipped{background:#eef3ff;color:var(--blue)}.badge.listed{background:#f0ebff;color:var(--purple)}.badge.bad{background:#fff0f2;color:var(--red)}.item-meta{font-size:.78rem;color:var(--muted);line-height:1.68;margin-top:7px}.item-actions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}.item-actions button{flex:1;min-width:72px}.calc-box{background:#f8f9fc;border:1px solid var(--border);border-radius:14px;padding:11px;margin:9px 0}.calc-row{display:flex;justify-content:space-between;font-size:.8rem;padding:3px 0}.calc-formula{font-size:.72rem;color:var(--muted);border-top:1px solid var(--border);padding-top:7px;margin-top:6px;line-height:1.5}.bar-wrap{display:flex;flex-direction:column;gap:8px}.bar-line{display:grid;grid-template-columns:76px 1fr 94px;gap:8px;align-items:center;font-size:.78rem}.bar-bg{height:12px;background:#eef0f6;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--accent);border-radius:999px}.table{width:100%;border-collapse:collapse;font-size:.78rem}.table th,.table td{border-bottom:1px solid var(--border);padding:8px 4px;text-align:right}.table th:first-child,.table td:first-child{text-align:left}.table th{color:var(--muted);font-size:.7rem}.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.empty{text-align:center;color:var(--muted);padding:22px 8px;font-weight:900}.toast{position:fixed;left:50%;bottom:94px;transform:translateX(-50%);background:#1f2230;color:#fff;border-radius:999px;padding:10px 16px;font-weight:950;font-size:.82rem;z-index:70;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:none;align-items:flex-end}.modal.open{display:flex}.modal-inner{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.modal-head h3{font-size:1.05rem}.close{border:none;background:#f1f2f7;border-radius:50%;width:38px;height:38px;font-weight:950;font-size:1.1rem}.detail-head{background:#f8f9fc;border:1px solid var(--border);border-radius:16px;padding:13px;margin-bottom:12px}.detail-head .label{font-weight:950}.detail-head .big{font-size:1.45rem;font-weight:950;margin-top:5px}.detail-row{border:1px solid var(--border);border-radius:15px;padding:12px;margin-bottom:9px;background:#fff}.detail-row-top{display:flex;justify-content:space-between;gap:8px;font-weight:950}.detail-row-sub{font-size:.77rem;color:var(--muted);line-height:1.65;margin-top:6px}.danger-zone{border:1px dashed #ffb5bf;background:#fff7f8}.mini-note{font-size:.73rem;color:var(--muted);line-height:1.55;margin-top:6px}.progress{height:10px;background:#eceef5;border-radius:999px;overflow:hidden;margin-top:8px}.progress div{height:100%;background:var(--green);border-radius:999px}.fixed-add{position:fixed;right:14px;bottom:18px;z-index:30;background:var(--accent);color:#fff;border:none;border-radius:999px;padding:14px 18px;font-weight:950;box-shadow:0 8px 22px rgba(255,77,109,.35)}.todo{border-left:5px solid var(--accent)}.todo-row{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--border);padding:10px 0}.todo-row:last-child{border-bottom:none}.todo-title{font-weight:950}.todo-sub{font-size:.75rem;color:var(--muted);margin-top:2px}.pill{font-size:.7rem;font-weight:950;border-radius:999px;padding:4px 9px;background:#f1f2f7;color:var(--muted);white-space:nowrap}.pill.red{background:#fff0f2;color:var(--red)}.pill.orange{background:#fff4df;color:#b37500}.pill.green{background:#e9fff7;color:var(--green)}.pill.blue{background:#eef3ff;color:var(--blue)}.seg-help{font-size:.73rem;color:var(--muted);margin:-3px 0 10px 2px}@media(min-width:760px){body{max-width:760px;margin:0 auto}.modal{align-items:center}.modal-inner{max-width:720px;margin:auto;border-radius:24px}.fixed-add{left:calc(50% + 285px);right:auto}}
</style>
</head>
<body>
<header><h1>せどり<span>管理</span></h1><div class="header-mini"><div id="todayMini"></div><div id="saveMini">保存済み</div></div></header>
<nav class="tabs"><button class="tab active" data-page="home" onclick="showPage('home')">ホーム</button><button class="tab" data-page="stock" onclick="showPage('stock')">在庫</button><button class="tab" data-page="analysis" onclick="showPage('analysis')">分析</button><button class="tab" data-page="data" onclick="showPage('data')">データ</button></nav>
<main>
<section id="home" class="page active"><div class="mode-toggle"><button class="active" onclick="setMode('all',this)">全体</button><button onclick="setMode('sedori',this)">せどり</button><button onclick="setMode('fuyohin',this)">不用品</button></div><div class="card todo"><div class="section-title">今日やること <span class="pill blue" id="todoCount">0件</span></div><div id="todoList"></div></div><div class="card"><div class="section-title">今の状況</div><div class="grid2" id="homeSummary"></div></div><div class="card"><div class="section-title">累計</div><div class="grid2" id="lifetimeSummary"></div></div><div class="card"><div class="section-title">今月の目標利益</div><div class="form-row"><div><label>目標利益 ¥</label><input id="goalInput" type="number" inputmode="numeric" placeholder="例：30000"></div><div style="display:flex;align-items:end"><button class="btn btn-blue" style="width:100%" onclick="saveGoal()">設定</button></div></div><div id="goalView"></div></div><div class="card"><div class="section-title">最近売れた商品</div><div id="recentSold" class="item-list"></div></div></section>
<section id="stock" class="page"><div class="mode-toggle" id="stockModeToggle"><button class="active" onclick="setStockMode('sedori',this)">せどり</button><button onclick="setStockMode('fuyohin',this)">不用品</button></div><div class="seg-help">在庫画面から商品追加できます。不用品は仕入れ値なしでも登録できます。</div><div class="card"><div class="section-title">在庫操作 <button class="btn btn-sm btn-primary" onclick="openAdd()">＋ 商品追加</button></div><div class="grid2" id="stockSummary"></div></div><div class="card"><div class="filter-bar"><select id="filterStatus" onchange="renderStock()"><option value="all">全ステータス</option><option value="unsold">仕入れ済み</option><option value="listed">出品中</option><option value="sold">売却済み</option><option value="shipped">発送済み</option></select><select id="filterCat" onchange="renderStock()"></select><input class="wide" id="filterSearch" placeholder="商品名・メモ検索" oninput="renderStock()"></div></div><div id="stockList" class="item-list"></div></section>
<section id="analysis" class="page"><div class="mode-toggle" id="analysisModeToggle"><button class="active" onclick="setAnalysisMode('sedori',this)">せどり</button><button onclick="setAnalysisMode('fuyohin',this)">不用品</button></div><div class="month-nav"><button class="btn btn-sm btn-ghost" onclick="moveMonth(-1)">前月</button><b id="analysisMonth"></b><button class="btn btn-sm btn-ghost" onclick="moveMonth(1)">翌月</button></div><div class="card"><div class="section-title">月の集計</div><div class="grid2" id="monthSummary"></div><div class="mini-note">利益＝売上−販売手数料−仕入れ値−送料−梱包費。手数料は保存時点の金額を使います。</div></div><div class="card"><div class="section-title">月別 売上・利益</div><div id="monthlyBars" class="bar-wrap"></div></div><div class="card"><div class="section-title">年別 売上・利益</div><div id="yearTable"></div></div><div class="card"><div class="section-title">カテゴリ別 利益</div><div id="catBars" class="bar-wrap"></div></div><div class="card"><div class="section-title">販売先別 売上・利益</div><div id="platformBars" class="bar-wrap"></div></div><div class="card"><div class="section-title">売れた履歴 <select id="soldMonthFilter" onchange="renderSoldHistory()"><option value="all">全期間</option></select></div><div id="soldHistory" class="item-list"></div></div></section>
<section id="data" class="page"><div class="card"><div class="section-title">データ管理</div><div id="dataCount" class="mini-note"></div><div class="form-row" style="margin-top:10px"><button class="btn btn-blue" onclick="downloadBackup()">バックアップ保存</button><label class="btn btn-ghost" style="text-align:center">バックアップ読込<input type="file" accept="application/json" onchange="restoreBackup(event)" style="display:none"></label></div></div><div class="card"><div class="section-title">CSV出力</div><div class="mode-toggle"><button id="csvSoldOnly" class="active" onclick="setCsvMode(true)">売れた商品</button><button id="csvAll" onclick="setCsvMode(false)">全商品</button></div><div class="form-row"><div><label>開始月</label><input id="csvStart" type="month" onchange="updateCsvPreview()"></div><div><label>終了月</label><input id="csvEnd" type="month" onchange="updateCsvPreview()"></div></div><div class="form-row"><button class="btn btn-green" onclick="downloadCSV()">CSV保存</button><button class="btn btn-ghost" onclick="copyCSV()">CSVコピー</button></div><div id="csvPreview" class="mini-note"></div></div><div class="card danger-zone"><div class="section-title">危険操作</div><button class="btn btn-danger" style="width:100%" onclick="deleteAll()">全データ削除</button></div></section>
</main>
<button class="fixed-add" onclick="openAdd()">＋ 商品追加</button>
<div class="toast" id="toast"></div>
<div class="modal" id="addModal"><div class="modal-inner"><div class="modal-head"><h3>商品追加</h3><button class="close" onclick="closeModal('addModal')">×</button></div><div class="quick-row" id="quickSources"></div><div id="lastCarry" class="mini-note"></div><div class="form-row single"><div><label>商品名</label><input id="fName" placeholder="例：ラグマート 長袖"></div></div><div class="form-row"><div><label>種類</label><select id="fType" onchange="syncTypeFields()"><option value="sedori">せどり</option><option value="fuyohin">不用品</option></select></div><div><label>仕入れ値 ¥</label><input id="fCost" type="number" inputmode="numeric" placeholder="不用品は0でOK"></div></div><div class="form-row"><div><label>仕入れ日</label><input id="fDate" type="date"></div><div><label>カテゴリ</label><select id="fCat"></select></div></div><div class="form-row"><div><label>仕入れ先</label><select id="fSource" onchange="syncSourceFields()"></select></div><div><label>ステータス</label><select id="fStatus"><option value="unsold">仕入れ済み</option><option value="listed">出品中</option></select></div></div><div class="form-row single"><div><label>メモ</label><textarea id="fMemo" placeholder="状態、付属品、相場など"></textarea></div></div><button class="btn btn-primary" style="width:100%" onclick="addItem()">保存する</button></div></div>
<div class="modal" id="soldModal"><div class="modal-inner"><div class="modal-head"><h3>売れた記録</h3><button class="close" onclick="closeModal('soldModal')">×</button></div><input type="hidden" id="soldId"><div class="form-row"><div><label>売値 ¥</label><input id="sPrice" type="number" inputmode="numeric" oninput="calcSoldPreview()"></div><div><label>売れた日</label><input id="sDate" type="date"></div></div><div class="form-row"><div><label>販売先</label><select id="sPlatform" onchange="calcSoldPreview()"><option value="mercari">メルカリ</option><option value="yahoo-flea">ヤフフリ</option><option value="yahoo-auction">ヤフオク</option><option value="other">その他</option></select></div><div><label>送料 ¥</label><input id="sShip" type="number" inputmode="numeric" oninput="calcSoldPreview()"></div></div><div class="form-row"><div><label>梱包費 ¥</label><input id="sMisc" type="number" inputmode="numeric" oninput="calcSoldPreview()"></div><div><label>&nbsp;</label><button class="btn btn-ghost" style="width:100%" onclick="openShipping()">送料表</button></div></div><div class="quick-row"><button class="btn btn-sm btn-ghost" onclick="setShip(210)">ネコポス210</button><button class="btn btn-sm btn-ghost" onclick="setShip(230)">ゆうパケット230</button><button class="btn btn-sm btn-ghost" onclick="setShip(750)">宅急便750</button><button class="btn btn-sm btn-ghost" onclick="setShip(0)">送料0</button></div><div class="calc-box" id="soldPreview"></div><button class="btn btn-green" style="width:100%" onclick="saveSold()">売却済みにする</button></div></div>
<div class="modal" id="editModal"><div class="modal-inner"><div class="modal-head"><h3>商品編集</h3><button class="close" onclick="closeModal('editModal')">×</button></div><input type="hidden" id="eId"><div class="form-row single"><div><label>商品名</label><input id="eName"></div></div><div class="form-row"><div><label>種類</label><select id="eType"><option value="sedori">せどり</option><option value="fuyohin">不用品</option></select></div><div><label>カテゴリ</label><select id="eCat"></select></div></div><div class="form-row"><div><label>仕入れ先</label><select id="eSource"></select></div><div><label>仕入れ値 ¥</label><input id="eCost" type="number" inputmode="numeric" oninput="calcEditPreview()"></div></div><div class="form-row"><div><label>仕入れ日</label><input id="eDate" type="date"></div><div><label>ステータス</label><select id="eStatus" onchange="toggleEditSold()"><option value="unsold">仕入れ済み</option><option value="listed">出品中</option><option value="sold">売却済み</option><option value="shipped">発送済み</option></select></div></div><div id="editSoldArea"><div class="form-row"><div><label>売値 ¥</label><input id="ePrice" type="number" inputmode="numeric" oninput="calcEditPreview()"></div><div><label>売れた日</label><input id="eSoldDate" type="date"></div></div><div class="form-row"><div><label>販売先</label><select id="ePlatform" onchange="calcEditPreview()"><option value="mercari">メルカリ</option><option value="yahoo-flea">ヤフフリ</option><option value="yahoo-auction">ヤフオク</option><option value="other">その他</option></select></div><div><label>送料 ¥</label><input id="eShip" type="number" inputmode="numeric" oninput="calcEditPreview()"></div></div><div class="form-row"><div><label>梱包費 ¥</label><input id="eMisc" type="number" inputmode="numeric" oninput="calcEditPreview()"></div><div></div></div><div class="calc-box" id="editPreview"></div></div><div class="form-row single"><div><label>メモ</label><textarea id="eMemo"></textarea></div></div><div class="form-row"><button class="btn btn-blue" onclick="saveEdit()">保存</button><button class="btn btn-danger" onclick="deleteItemFromEdit()">削除</button></div></div></div>
<div class="modal" id="detailModal"><div class="modal-inner"><div class="modal-head"><h3 id="detailTitle">一覧</h3><button class="close" onclick="closeModal('detailModal')">×</button></div><div id="detailSummary"></div><div id="detailList"></div></div></div>
<div class="modal" id="shipModal"><div class="modal-inner"><div class="modal-head"><h3>送料早見表</h3><button class="close" onclick="closeModal('shipModal')">×</button></div><div id="shipTable"></div><div class="mini-note">送料は変更される場合があります。実際の金額は売れた記録で手入力してください。</div></div></div>
<script>
const CATS=['レトロゲーム','トレカ','ブランド品','古着','電子機器','本・漫画','おもちゃ','日用品','その他'];
const SOURCES=['不用品','ハードオフ','ブックオフ','メルカリ','ヤフオク','リサイクルショップ','フリマ','その他'];
const PLATFORM_FEE={mercari:.10,'yahoo-flea':.05,'yahoo-auction':.10,other:0};
const PLATFORM_NAME={mercari:'メルカリ','yahoo-flea':'ヤフフリ','yahoo-auction':'ヤフオク',other:'その他'};
const STATUS_NAME={unsold:'仕入れ済み',listed:'出品中',sold:'売却済み',shipped:'発送済み'};
let items=JSON.parse(localStorage.getItem('sedori_items')||'[]');
let mode='all',stockMode='sedori',analysisMode='sedori',viewDate=new Date(),csvSoldOnly=true,detailCache={};
function $(id){return document.getElementById(id)}function uid(){return Date.now()+Math.floor(Math.random()*9999)}function today(){return new Date().toISOString().slice(0,10)}function ymDate(d){return d.toISOString().slice(0,7)}function yen(n){return '¥'+Math.round(Number(n)||0).toLocaleString()}function pct(n){return Number.isFinite(Number(n))?Math.round(Number(n)).toLocaleString()+'%':'-'}function escapeHtml(s){return String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function normalize(){items=(items||[]).map(i=>{let type=i.type||(i.source==='不用品'?'fuyohin':'sedori');if(type==='personal')type='fuyohin';const rawStatus=String(i.status||i.state||i.statusName||'').trim();let status=rawStatus||'';const statusMap={stock:'unsold',inventory:'unsold',unsold:'unsold','仕入れ済み':'unsold','未出品':'unsold',listed:'listed',listing:'listed',active:'listed',onSale:'listed','出品中':'listed','出品済み':'listed',sold:'sold','売却済み':'sold','売れた':'sold',shipped:'shipped','発送済み':'shipped','完了':'shipped'};status=statusMap[status]||status;const hasShipped=!!(i.shipped||i.isShipped||i.shippedDate||i.deliveryDone);const hasSold=!!(i.sold||i.isSold||i.soldDate||i.sellDate||i.soldPrice||i.salePrice||i.actualPrice);const hasListed=!!(i.listed||i.isListed||i.listedDate||i.listingDate||i.exhibited||i.isExhibited);if(!status){if(hasShipped)status='shipped';else if(hasSold)status='shipped';else if(hasListed)status='listed';else status='unsold'}if(!['unsold','listed','sold','shipped'].includes(status))status='unsold';const soldState=status==='sold'||status==='shipped';let needShip=Boolean(i.needShip);if(status==='shipped'||hasShipped)needShip=false;if(status==='sold'&&i.needShip===undefined&&rawStatus!=='sold')needShip=false;const listPrice=Number(i.listPrice??i.askingPrice??(!soldState?i.price:0)??0);const soldPrice=Number(i.actualPrice??i.soldPrice??i.salePrice??i.sellPrice??(soldState?i.price:0)??0);const feeSaved=(i.feeAmount!==undefined)?Number(i.feeAmount):(i.fee!==undefined)?Number(i.fee):(i.commission!==undefined)?Number(i.commission):undefined;return{id:i.id||uid(),name:i.name||i.productName||'無題',cat:i.cat||i.category||'その他',source:i.source||'その他',type,cost:Number(i.cost??i.buyPrice??0),price:listPrice,actualPrice:soldState?soldPrice:0,ship:Number(i.ship??i.shipping??i.shipCost??0),misc:Number(i.misc??i.packing??i.packCost??0),feeAmount:Number.isFinite(feeSaved)?feeSaved:undefined,status,needShip,platform:i.platform||'mercari',date:i.date||i.buyDate||i.purchaseDa function save(){localStorage.setItem('sedori_items',JSON.stringify(items));$('saveMini').textContent='保存済み'}function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}function matchMode(it,m=mode){if(m==='sedori')return it.type==='sedori';if(m==='fuyohin')return it.type==='fuyohin';return true}function isSold(it){return it.status==='sold'||it.status==='shipped'}function feeRate(p){return PLATFORM_FEE[p]??.10}function fee(price,platform){return Math.floor((Number(price)||0)*feeRate(platform))}function salePriceOf(it){return isSold(it)?Number(it.actualPrice||0):0}function feeOf(it){if(!isSold(it))return 0;const saved=Number(it.feeAmount);return Number.isFinite(saved)&&saved>=0?saved:fee(salePriceOf(it),it.platform)}function profitOf(it){if(!isSold(it))return 0;return salePriceOf(it)-feeOf(it)-Number(it.cost||0)-Number(it.ship||0)-Number(it.misc||0)}function roiOf(it){const c=Number(it.cost||0);return isSold(it)&&c?Math.round(profitOf(it)/c*100):0}function soldItems(m='all'){return items.filter(i=>isSold(i)&&matchMode(i,m))}function inventoryItems(m='all'){return items.filter(i=>!isSold(i)&&matchMode(i,m))}

function fillSelect(id,arr,val){$(id).innerHTML=arr.map(x=>`<option value="${escapeHtml(x)}">${escapeHtml(x)}</option>`).join('');if(val)$(id).value=val}function init(){normalize();save();fillSelect('fCat',CATS);fillSelect('fSource',SOURCES);fillSelect('eCat',CATS);fillSelect('eSource',SOURCES);$('fDate').value=today();$('sDate').value=today();$('todayMini').textContent=new Date().toLocaleDateString('ja-JP',{month:'numeric',day:'numeric',weekday:'short'});$('goalInput').value=localStorage.getItem('sedori_goal')||'';renderQuickSources();renderAll()}

function renderTodo(){const now=new Date();const arr=[];items.filter(i=>matchMode(i,mode)).forEach(i=>{const age=Math.floor((now-new Date(i.date||today()))/86400000);if(i.status==='unsold')arr.push({t:i.name,s:'未出品です。出品したら「出品中」に変更。',p:'未出品',c:'orange',id:i.id});if(i.status==='sold'&&i.needShip)arr.push({t:i.name,s:'売却済みです。発送したら「発送済み」に変更。',p:'未発送',c:'red',id:i.id});if(!isSold(i)&&age>=30)arr.push({t:i.name,s:`仕入れから${age}日。値下げ・写真変更候補。`,p:age>=90?'90日超':age>=60?'60日超':'30日超',c:age>=90?'red':'orange',id:i.id});if(isSold(i)&&profitOf(i)<0)arr.push({t:i.name,s:`利益 ${yen(profitOf(i))}。次回仕入れ注意。`,p:'赤字',c:'red',id:i.id})});$('todoCount').textContent=arr.length+'件';$('todoList').innerHTML=arr.length?arr.slice(0,8).map(x=>`<div class="todo-row" onclick="openEdit(${x.id})"><div><div class="todo-title">${escapeHtml(x.t)}</div><div class="todo-sub">${escapeHtml(x.s)}</div></div><span class="pill ${x.c}">${x.p}</span></div>`).join(''):'<div class="empty">今すぐやることはありません</div>'}

function renderQuickSources(){$('quickSources').innerHTML=SOURCES.map(s=>`<button class="btn btn-sm btn-ghost quick-src" onclick="setQuickSource('${escapeHtml(s)}')">${escapeHtml(s)}</button>`).join('')}function setQuickSource(s){$('fSource').value=s;if(s==='不用品'){$('fType').value='fuyohin';$('fCost').value=$('fCost').value||0}highlightQuickSource()}function highlightQuickSource(){document.querySelectorAll('.quick-src').forEach(b=>b.classList.toggle('btn-primary',b.textContent===$('fSource').value))}function syncTypeFields(){if($('fType').value==='fuyohin'){$('fSource').value='不用品';if(!$('fCost').value)$('fCost').value=0}highlightQuickSource()}function syncSourceFields(){if($('fSource').value==='不用品'){$('fType').value='fuyohin';if(!$('fCost').value)$('fCost').value=0}highlightQuickSource()}function updateLastCarry(){const last=JSON.parse(localStorage.getItem('sedori_last_entry')||'null');if(!last){$('lastCarry').style.display='none';return}$('lastCarry').style.display='block';$('lastCarry').innerHTML=`前回: ${escapeHtml(last.source)} / ${escapeHtml(last.cat)} <button class="btn btn-sm btn-ghost" onclick="applyLastCarry()">引き継ぐ</button>`}function applyLastCarry(){const last=JSON.parse(localStorage.getItem('sedori_last_entry')||'null');if(!last)return;$('fCat').value=last.cat;$('fSource').value=last.source;$('fType').value=last.type||($('fSource').value==='不用品'?'fuyohin':'sedori');$('fMemo').value=last.memo||'';highlightQuickSource();toast('前回内容を引き継ぎました')}

function updateFilters(){fillSelect('filterCat',['全カテゴリ',...CATS]);const months=[...new Set(soldItems('all').map(i=>(i.soldDate||'').slice(0,7)).filter(Boolean))].sort().reverse();const current=$('soldMonthFilter').value;$('soldMonthFilter').innerHTML='<option value="all">全期間</option>'+months.map(m=>`<option value="${m}">${m}</option>`).join('');if([...$('soldMonthFilter').options].some(o=>o.value===current))$('soldMonthFilter').value=current}function renderStock(){const inv=items.filter(i=>matchMode(i,stockMode));const shown=inv.filter(i=>($('filterStatus').value==='all'||i.status===$('filterStatus').value)&&($('filterCat').value==='全カテゴリ'||!$('filterCat').value||i.cat===$('filterCat').value)&&(!$('filterSearch').value||(`${i.name} ${i.memo} ${i.source}`).toLowerCase().includes($('filterSearch').value.toLowerCase())));const invOnly=inventoryItems(stockMode);const sold=soldItems(stockMode);$('stockSummary').innerHTML=detailCard('stock_all','全件',inv.length+'件','blue',inv,'在庫画面の全商品')+detailCard('stock_inventory','未販売',invOnly.length+'件','orange',invOnly,'未販売の商品')+detailCard('stock_sold','売却済み',sold.length+'件','green',sold,'売れた商品')+detailCard('stock_cost','未販売仕入れ',yen(summarize(invOnly).cost),'',invOnly,'未販売仕入れの内訳');$('stockList').innerHTML=shown.length?shown.map(itemHtml).join(''):'<div class="empty">商品がありません</div>'}

function changeStatus(id,st){const it=items.find(i=>i.id==id);if(!it)return;it.status=st;if(st==='shipped')it.needShip=false;if(st==='sold')it.needShip=true;save();renderAll();toast(STATUS_NAME[st]+'にしました')}function openSold(id){const it=items.find(i=>i.id==id);if(!it)return;$('soldId').value=id;$('sPrice').value=salePriceOf(it)||'';$('sShip').value=it.ship||'';$('sMisc').value=it.misc||'';$('sDate').value=today();$('sPlatform').value=it.platform||'mercari';calcSoldPreview();$('soldModal').classList.add('open')}function setShip(n){$('sShip').value=n;calcSoldPreview()}function calcSoldPreview(){const it=items.find(i=>i.id==$('soldId').value);const price=Number($('sPrice').value)||0,ship=Number($('sShip').value)||0,misc=Number($('sMisc').value)||0,cost=Number(it?.cost||0),pf=fee(price,$('sPlatform').value),p=price-pf-cost-ship-misc,roi=cost?Math.round(p/cost*100):0;$('soldPreview').innerHTML=`<div class="calc-row"><span>売上</span><b>${yen(price)}</b></div><div class="calc-row"><span>手数料</span><b>${yen(pf)}</b></div><div class="calc-row"><span>仕入れ値</span><b>${yen(cost)}</b></div><div class="calc-row"><span>送料＋梱包費</span><b>${yen(ship+misc)}</b></div><div class="calc-row"><span>利益</span><b class="${p>=0?'green':'red'}">${yen(p)}</b></div><div class="calc-row"><span>ROI</span><b>${pct(roi)}</b></div><div class="calc-formula">計算式：${yen(price)} − ${yen(pf)} − ${yen(cost)} − ${yen(ship)} − ${yen(misc)} ＝ ${yen(p)}</div>`}function saveSold(){const it=items.find(i=>i.id==$('soldId').value);if(!it)return;const price=Number($('sPrice').value)||0;if(!price){toast('売値を入力してください');return}it.status='sold';it.needShip=true;it.actualPrice=price;it.price=0;it.ship=Number($('sShip').value)||0;it.misc=Number($('sMisc').value)||0;it.soldDate=$('sDate').value||today();it.platform=$('sPlatform').value;it.feeAmount=fee(price,it.platform);save();closeModal('soldModal');renderAll();toast('売れた記録を保存しました')}
function deleteItem(id){if(!confirm('削除しますか？'))return;items=items.filter(i=>i.id!=id);save();renderAll();toast('削除しました')}function deleteItemFromEdit(){const id=$('eId').value;closeModal('editModal');deleteItem(id)}function openEdit(id){const it=items.find(i=>i.id==id);if(!it)return;$('eId').value=id;$('eName').value=it.name;$('eCat').value=it.cat;$('eSource').value=it.source;$('eType').value=it.type;$('eCost').value=it.cost||0;$('eShip').value=it.ship||0;$('eMisc').value=it.misc||0;$('eDate').value=it.date||today();$('eStatus').value=it.status||'unsold';$('eSoldDate').value=it.soldDate||today();$('ePrice').value=salePriceOf(it)||'';$('ePlatform').value=it.platform||'mercari';$('eMemo').value=it.memo||'';toggleEditSold();$('editModal').classList.add('open')}function toggleEditSold(){$('editSoldArea').style.display=($('eStatus').value==='sold'||$('eStatus').value==='shipped')?'block':'none';calcEditPreview()}function calcEditPreview(){const price=Number($('ePrice').value)||0,cost=Number($('eCost').value)||0,ship=Number($('eShip').value)||0,misc=Number($('eMisc').value)||0,pf=fee(price,$('ePlatform').value),p=price-pf-cost-ship-misc,roi=cost?Math.round(p/cost*100):0;$('editPreview').innerHTML=`<div class="calc-row"><span>売上</span><b>${yen(price)}</b></div><div class="calc-row"><span>手数料</span><b>${yen(pf)}</b></div><div class="calc-row"><span>仕入れ値</span><b>${yen(cost)}</b></div><div class="calc-row"><span>送料＋梱包費</span><b>${yen(ship+misc)}</b></div><div class="calc-row"><span>利益</span><b class="${p>=0?'green':'red'}">${yen(p)}</b></div><div class="calc-row"><span>ROI</span><b>${pct(roi)}</b></div><div class="calc-formula">計算式：${yen(price)} − ${yen(pf)} − ${yen(cost)} − ${yen(ship)} − ${yen(misc)} ＝ ${yen(p)}</div>`}function saveEdit(){const it=items.find(i=>i.id==$('eId').value);if(!it)return;it.name=$('eName').value.trim()||it.name;it.cat=$('eCat').value;it.source=$('eSource').value;it.type=$('eType').value;it.cost=Number($('eCost').value)||0;it.ship=Number($('eShip').value)||0;it.misc=Number($('eMisc').value)||0;it.date=$('eDate').value||today();it.memo=$('eMemo').value.trim();if(it.source==='不用品')it.type='fuyohin';const oldStatus=it.status,oldNeedShip=it.needShip;it.status=$('eStatus').value;if(isSold(it)){it.needShip=it.status==='sold'?(oldStatus==='sold'?oldNeedShip:true):false;it.soldDate=$('eSoldDate').value||today();it.actualPrice=Number($('ePrice').value)||0;it.price=0;it.platform=$('ePlatform').value;it.feeAmount=fee(it.actualPrice,it.platform)}else{it.needShip=false;it.soldDate='';it.actualPrice=0;it.feeAmount=undefined}save();closeModal('editModal');renderAll();toast('保存しました')}
function moveMonth(n){viewDate.setMonth(viewDate.getMonth()+n);renderAnalysis()}function renderAnalysis(){const target=ymDate(viewDate);const label=analysisMode==='sedori'?'せどり':'不用品';$('analysisMonth').textContent=target+' / '+label;const monthArr=soldItems(analysisMode).filter(i=>(i.soldDate||'').startsWith(target));const ms=summarize(monthArr);$('monthSummary').innerHTML=detailCard('analysis_profit','利益',yen(ms.profit),ms.profit>=0?'green':'red',monthArr,target+' 利益の内訳')+detailCard('analysis_sales','売上',yen(ms.sales),'orange',monthArr,target+' 売上一覧')+detailCard('analysis_count','販売数',ms.count+'件','blue',monthArr,target+' 販売商品')+detailCard('analysis_roi','ROI',pct(ms.roi),'purple',monthArr,target+' ROIの対象商品');renderMonthlyBars();renderYearTable();renderCatBars();renderPlatformBars();renderSoldHistory()}function groupBy(arr,keyFn){const m={};arr.forEach(i=>{const k=keyFn(i)||'未設定';(m[k]||(m[k]=[])).push(i)});return m}function renderMonthlyBars(){const g=groupBy(soldItems(analysisMode),i=>(i.soldDate||'').slice(0,7));const rows=Object.keys(g).sort().reverse().slice(0,12).map(k=>({k,...summarize(g[k])}));const max=Math.max(1,...rows.map(r=>r.sales));$('monthlyBars').innerHTML=rows.length?rows.map(r=>barLine(r.k,r.sales,max,`${yen(r.sales)} / 利益 ${yen(r.profit)}`)).join(''):'<div class="empty">データなし</div>'}function renderYearTable(){const g=groupBy(soldItems(analysisMode),i=>(i.soldDate||'').slice(0,4));const rows=Object.keys(g).sort().reverse().map(k=>({k,...summarize(g[k])}));$('yearTable').innerHTML=rows.length?`<table class="table"><tr><th>年</th><th>売上</th><th>利益</th><th>数</th><th>ROI</th></tr>${rows.map(r=>`<tr><td>${r.k}</td><td>${yen(r.sales)}</td><td>${yen(r.profit)}</td><td>${r.count}</td><td>${pct(r.roi)}</td></tr>`).join('')}</table>`:'<div class="empty">データなし</div>'}function renderCatBars(){const g=groupBy(soldItems(analysisMode),i=>i.cat);const rows=Object.keys(g).map(k=>({k,...summarize(g[k])})).sort((a,b)=>b.profit-a.profit);const max=Math.max(1,...rows.map(r=>Math.max(0,r.profit)));$('catBars').innerHTML=rows.length?rows.map(r=>barLine(r.k,Math.max(0,r.profit),max,`${yen(r.profit)} / ${r.count}件`)).join(''):'<div class="empty">データなし</div>'}function renderPlatformBars(){const g=groupBy(soldItems(analysisMode),i=>PLATFORM_NAME[i.platform]||'未設定');const rows=Object.keys(g).map(k=>({k,...summarize(g[k])})).sort((a,b)=>b.sales-a.sales);const max=Math.max(1,...rows.map(r=>r.sales));$('platformBars').innerHTML=rows.length?rows.map(r=>barLine(r.k,r.sales,max,`${yen(r.sales)} / 利益 ${yen(r.profit)}`)).join(''):'<div class="empty">データなし</div>'}function barLine(label,value,max,right){return `<div class="bar-line"><div>${escapeHtml(label)}</div><div class="bar-bg"><div class="bar" style="width:${Math.max(3,Math.round(value/max*100))}%"></div></div><div style="text-align:right">${right}</div></div>`}function renderSoldHistory(){const m=$('soldMonthFilter').value;let arr=soldItems(analysisMode).filter(i=>m==='all'||(i.soldDate||'').startsWith(m)).sort((a,b)=>(b.soldDate||'').localeCompare(a.soldDate||''));$('soldHistory').innerHTML=arr.length?arr.map(itemHtml).join(''):'<div class="empty">履歴なし</div>'}
function openDetail(key){const d=detailCache[key];if(!d)return;const arr=d.items||[];const sum=summarize(arr);$('detailTitle').textContent=d.title||'一覧';$('detailSummary').innerHTML=`<div class="detail-head"><div class="label">${escapeHtml(d.label||'合計')}</div><div class="big ${sum.profit>=0?'green':'red'}">${escapeHtml(d.value||yen(sum.profit))}</div><div class="mini-note">件数 ${arr.length}件 / 売上 ${yen(sum.sales)} / 利益 ${yen(sum.profit)} / 仕入れ ${yen(sum.cost)} / 手数料 ${yen(sum.fees)} / 送料 ${yen(sum.ship)} / 梱包費 ${yen(sum.misc)} / ROI ${pct(sum.roi)}<br>利益＝売上−販売手数料−仕入れ値−送料−梱包費</div></div>`;$('detailList').innerHTML=arr.length?arr.map(detailItemHtml).join(''):'<div class="empty">対象の商品はありません</div>';$('detailModal').classList.add('open')}function detailItemHtml(it){const sold=isSold(it),price=salePriceOf(it),p=profitOf(it);return `<div class="detail-row" onclick="openEdit(${it.id})"><div class="detail-row-top"><div>${escapeHtml(it.name)}</div><div class="${sold?(p>=0?'green':'red'):'blue'}">${sold?yen(p):yen(it.cost)}</div></div><div class="detail-row-sub">${STATUS_NAME[it.status]||it.status} / ${it.type==='fuyohin'?'不用品':'せどり'} / ${escapeHtml(it.cat)}<br>${sold?'売上 '+yen(price)+' − 手数料 '+yen(feeOf(it))+' − 仕入れ '+yen(it.cost)+' − 送料 '+yen(it.ship)+' − 梱包費 '+yen(it.misc)+' ＝ 利益 '+yen(p)+'<br>売れた日 '+(it.soldDate||'-')+' / '+(PLATFORM_NAME[it.platform]||'未設定'):'仕入れ日 '+(it.date||'-')+' / 仕入れ先 '+escapeHtml(it.source)}${it.memo?'<br>'+escapeHtml(it.memo):''}</div></div>`}
function renderData(){$('dataCount').textContent=`全データ件数: ${items.length}件 / 売れた: ${soldItems('all').length}件 / 未販売: ${inventoryItems('all').length}件`;updateCsvPreview()}function makeCSV(){const start=$('csvStart').value,end=$('csvEnd').value;let arr=csvSoldOnly?soldItems('all'):[...items];arr=arr.filter(i=>{const d=(isSold(i)?i.soldDate:i.date)||'';const m=d.slice(0,7);return (!start||m>=start)&&(!end||m<=end)});const head=['商品名','種類','カテゴリ','仕入れ先','仕入れ日','状態','売れた日','売上','仕入れ値','送料','梱包費','手数料','利益','ROI','販売先','メモ'];const rows=arr.map(i=>[i.name,i.type==='fuyohin'?'不用品':'せどり',i.cat,i.source,i.date,STATUS_NAME[i.status]||i.status,i.soldDate,salePriceOf(i),i.cost||0,i.ship||0,i.misc||0,feeOf(i),profitOf(i),roiOf(i),PLATFORM_NAME[i.platform]||'',i.memo||'']);return [head,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n')}function setCsvMode(v){csvSoldOnly=v;$('csvSoldOnly').classList.toggle('active',v);$('csvAll').classList.toggle('active',!v);updateCsvPreview()}function updateCsvPreview(){if(!$('csvPreview'))return;const csv=makeCSV();$('csvPreview').textContent='プレビュー: '+csv.split('\n').slice(0,3).join(' / ')}function downloadCSV(){downloadBlob(new Blob(['\ufeff'+makeCSV()],{type:'text/csv'}),`sedori_${today()}.csv`);toast('CSVを保存しました')}function copyCSV(){navigator.clipboard.writeText(makeCSV()).then(()=>toast('CSVをコピーしました')).catch(()=>toast('コピーできませんでした'))}
function downloadBackup(){const data={version:'2026-06-17',items,goal:localStorage.getItem('sedori_goal')||0,exportedAt:new Date().toISOString()};downloadBlob(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),`sedori_backup_${today()}.json`);toast('バックアップを保存しました')}function restoreBackup(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);const next=Array.isArray(data)?data:data.items;if(!Array.isArray(next))throw new Error();if(!confirm('現在のデータを上書きして復元しますか？'))return;items=next;normalize();if(data.goal!==undefined)localStorage.setItem('sedori_goal',data.goal);save();renderAll();toast('復元しました')}catch{toast('復元できませんでした')}};r.readAsText(file)}function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function deleteAll(){if(!confirm('全データを削除しますか？'))return;if(!confirm('本当に削除します。バックアップは保存しましたか？'))return;items=[];save();renderAll();toast('全データを削除しました')}function openShipping(){const rows=[['ネコポス','小型','210円前後'],['ゆうパケット','小型','230円前後'],['宅急便コンパクト','専用箱','450円前後'],['宅急便/ゆうパック','60サイズ','750円前後〜'],['普通郵便','軽量','重量で変動']];$('shipTable').innerHTML=`<table class="table"><tr><th>種別</th><th>サイズ</th><th>送料</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table>`;$('shipModal').classList.add('open')}function closeModal(id){$(id).classList.remove('open')}
init();
