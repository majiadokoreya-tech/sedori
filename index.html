<title>せどり管理</title>
<style>

fff4df;color:#b37500}.badge.shipped{background:#eef3ff;color:var(--blue)}.badge.listed{background:#f0ebff;color:var(--purple)}.badge.bad{background:#fff0f2;color:var(--red)}.item-meta{font-size:.76rem;color:var(--muted);line-height:1.65;margin-top:6px}.item-actions{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}.item-actions button{flex:1;min-width:72px}.calc-box{background:#f8f9fc;border:1px solid var(--border);border-radius:13px;padding:10px;margin:8px 0;display:grid;grid-template-columns:1fr 1fr;gap:7px}.calc-row{display:flex;justify-content:space-between;font-size:.78rem}.calc-row b{font-variant-numeric:tabular-nums}.bar-wrap{display:flex;flex-direction:column;gap:8px}.bar-line{display:grid;grid-template-columns:72px 1fr 86px;gap:8px;align-items:center;font-size:.78rem}.bar-bg{height:12px;background:#eef0f6;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--accent);border-radius:999px}.table{width:100%;border-collapse:collapse;font-size:.78rem}.table th,.table td{border-bottom:1px solid var(--border);padding:8px 4px;text-align:right}.table th:first-child,.table td:first-child{text-align:left}.table th{color:var(--muted);font-size:.7rem}.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.empty{text-align:center;color:var(--muted);padding:22px 8px;font-weight:800}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#1f2230;color:#fff;border-radius:999px;padding:10px 16px;font-weight:900;font-size:.82rem;z-index:50;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;align-items:flex-end}.modal.open{display:flex}.modal-inner{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modal-head h3{font-size:1rem}.close{border:none;background:#f1f2f7;border-radius:50%;width:34px;height:34px;font-weight:900}.danger-zone{border:1px dashed #ffb5bf;background:#fff7f8}.mini-note{font-size:.72rem;color:var(--muted);line-height:1.5;margin-top:6px}.progress{height:9px;background:#eceef5;border-radius:999px;overflow:hidden;margin-top:7px}.progress div{height:100%;background:var(--green);border-radius:999px}.fixed-add{position:fixed;right:14px;bottom:18px;z-index:22;background:var(--accent);color:#fff;border:none;border-radius:999px;padding:14px 16px;font-weight:900;box-shadow:0 8px 22px rgba(255,77,109,.35)}.todo{border-left:5px solid var(--accent)}.todo-row{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--border);padding:9px 0}.todo-row:last-child{border-bottom:none}.todo-title{font-weight:900}.todo-sub{font-size:.72rem;color:var(--muted);margin-top:2px}.pill{font-size:.7rem;font-weight:900;border-radius:999px;padding:4px 8px;background:#f1f2f7;color:var(--muted);white-space:nowrap}.pill.red{background:#fff0f2;color:var(--red)}.pill.orange{background:#fff4df;color:#b37500}.pill.green{background:#e9fff7;color:var(--green)}.pill.blue{background:#eef3ff;color:var(--blue)}.seg-help{font-size:.72rem;color:var(--muted);margin:-3px 0 10px 2px}.summary-card.clickable{cursor:pointer;position:relative;transition:transform .12s,box-shadow .12s}.summary-card.clickable:active{transform:scale(.98)}.summary-card.clickable:after{content:"一覧";position:absolute;right:9px;top:9px;font-size:.62rem;font-weight:900;color:var(--accent);background:#fff0f4;border-radius:999px;padding:2px 6px}.detail-head{background:#f8f9fc;border:1px solid var(--border);border-radius:14px;padding:10px;margin-bottom:10px}.detail-head .big{font-size:1.25rem;font-weight:900;margin-top:4px}.detail-row{border:1px solid var(--border);border-radius:14px;padding:10px;margin-bottom:8px;background:#fff}.detail-row-top{display:flex;justify-content:space-between;gap:8px;font-weight:900}.detail-row-sub{font-size:.74rem;color:var(--muted);line-height:1.6;margin-top:4px}.hint-tap{font-size:.7rem;color:var(--muted);margin-top:8px}@media(min-width:760px){body{max-width:760px;margin:0 auto}.modal{align-items:center}.modal-inner{max-width:720px;margin:auto;border-radius:22px}.fixed-add{left:calc(50% + 290px);right:auto}}
</style>
</head>
<body>
<header><h1>せどり<span>管理</span></h1><div class="header-mini"><div id="todayMini"></div><div id="saveMini">保存済み</div></div></header>
<nav class="tabs"><button class="tab active" data-page="home" onclick="showPage('home')">ホーム</button><button class="tab" data-page="stock" onclick="showPage('stock')">在庫</button><button class="tab" data-page="analysis" onclick="showPage('analysis')">分析</button><button class="tab" data-page="data" onclick="showPage('data')">データ</button></nav>
<main>
<section id="home" class="page active">
  <div class="mode-toggle"><button class="active" onclick="setMode('all',this)">全体</button><button onclick="setMode('sedori',this)">せどり</button><button onclick="setMode('fuyohin',this)">不用品</button></div>
  <div class="card todo"><div class="section-title">今日やること <span class="pill blue" id="todoCount">0件</span></div><div id="todoList"></div></div>
  <div class="card"><div class="section-title">今の状況</div><div class="grid2" id="homeSummary"></div></div>
  <div class="card"><div class="section-title">累計</div><div class="grid2" id="lifetimeSummary"></div></div>
  <div class="card"><div class="section-title">今月の目標利益</div><div class="form-row"><div><label>目標利益 ¥</label><input id="goalInput" type="number" inputmode="numeric" placeholder="例：30000"></div><div style="display:flex;align-items:end"><button class="btn btn-blue" style="width:100%" onclick="saveGoal()">設定</button></div></div><div id="goalView"></div></div>
  <div class="card"><div class="section-title">最近売れた商品</div><div id="recentSold" class="item-list"></div></div>
</section>
<section id="stock" class="page">
  <div class="mode-toggle" id="stockModeToggle"><button class="active" onclick="setStockMode('sedori',this)">せどり</button><button onclick="setStockMode('fuyohin',this)">不用品</button></div>
  <div class="seg-help">不用品は仕入れ値なしでも登録できます。</div>
  <div class="card"><div class="section-title">在庫操作 <button class="btn btn-sm btn-primary" style="width:auto" onclick="openAdd()">＋ 商品追加</button></div><div class="grid2" id="stockSummary"></div></div>
  <div class="card"><div class="filter-bar"><select id="filterStatus" onchange="renderStock()"><option value="all">全ステータス</option><option value="unsold">仕入れ済み</option><option value="listed">出品中</option><option value="sold">売却済み</option><option value="shipped">発送済み</option></select><select id="filterCat" onchange="renderStock()"></select><input class="wide" id="filterSearch" placeholder="商品名・メモ検索" oninput="renderStock()"></div></div>
  <div id="stockList" class="item-list"></div>
</section>
<section id="analysis" class="page">
  <div class="mode-toggle" id="analysisModeToggle"><button class="active" onclick="setAnalysisMode('sedori',this)">せどり</button><button onclick="setAnalysisMode('fuyohin',this)">不用品</button></div>
  <div class="card"><div class="month-nav"><button class="btn btn-sm btn-ghost" onclick="moveMonth(-1)">前月</button><b id="analysisMonth"></b><button class="btn btn-sm btn-ghost" onclick="moveMonth(1)">翌月</button></div><div class="grid2" id="monthSummary"></div></div>
  <div class="card"><div class="section-title">月別 売上・利益</div><div id="monthlyBars" class="bar-wrap"></div></div>
  <div class="card"><div class="section-title">年別 売上・利益</div><div id="yearTable"></div></div>
  <div class="card"><div class="section-title">カテゴリ別 利益</div><div id="catBars" class="bar-wrap"></div></div>
  <div class="card"><div class="section-title">販売先別 売上</div><div id="platformBars" class="bar-wrap"></div></div>
  <div class="card"><div class="section-title">売れた履歴 <select id="soldMonthFilter" onchange="renderSoldHistory()" style="width:auto;padding:6px;font-size:13px"></select></div><div id="soldHistory" class="item-list"></div></div>
</section>
<section id="data" class="page">
  <div class="card"><div class="section-title">バックアップ</div><div class="mini-note">スマホ変更や万一に備えてJSON保存できます。</div><button class="btn btn-primary" onclick="downloadBackup()">バックアップ保存</button><label class="btn btn-ghost" style="display:block;text-align:center;margin-top:8px"><input type="file" accept="application/json" onchange="restoreBackup(event)" hidden>バックアップ読込</label></div>
  <div class="card"><div class="section-title">CSV出力</div><div class="form-row"><div><label>開始月</label><input id="csvStart" type="month" onchange="updateCsvPreview()"></div><div><label>終了月</label><input id="csvEnd" type="month" onchange="updateCsvPreview()"></div></div><div class="mode-toggle"><button id="csvSoldOnly" class="active" onclick="setCsvMode(true)">売れた商品のみ</button><button id="csvAll" onclick="setCsvMode(false)">全商品</button></div><div class="mini-note" id="csvPreview"></div><div class="form-row"><button class="btn btn-blue" onclick="downloadCSV()">CSV保存</button><button class="btn btn-ghost" onclick="copyCSV()">CSVコピー</button></div></div>
  <div class="card danger-zone"><div class="section-title">データ管理</div><div id="dataCount" class="mini-note"></div><button class="btn btn-danger" style="width:100%;margin-top:10px" onclick="deleteAll()">全データを削除</button></div>
</section>
</main>
<button class="fixed-add" onclick="openAdd()">＋ 商品追加</button>
<div id="toast" class="toast"></div>
<div class="modal" id="addModal"><div class="modal-inner"><div class="modal-head"><h3 id="addTitle">商品追加</h3><button class="close" onclick="closeModal('addModal')">×</button></div><div class="quick-row" id="quickSources"></div><div id="lastCarry" class="mini-note"></div><div class="form-row single"><div><label>商品名</label><input id="fName" placeholder="例：Switch ソフト"></div></div><div class="form-row"><div><label>種類</label><select id="fType" onchange="syncTypeFields()"><option value="sedori">せどり</option><option value="fuyohin">不用品</option></select></div><div><label>仕入れ値 ¥</label><input id="fCost" type="number" inputmode="numeric" placeholder="不用品は0でOK"></div></div><div class="form-row"><div><label>仕入れ日</label><input id="fDate" type="date"></div><div><label>カテゴリ</label><select id="fCat"></select></div></div><div class="form-row"><div><label>仕入れ先</label><select id="fSource"></select></div><div><label>ステータス</label><select id="fStatus"><option value="unsold">仕入れ済み</option><option value="listed">出品中</option></select></div></div><div class="form-row single"><div><label>メモ</label><textarea id="fMemo" placeholder="状態、付属品、相場など"></textarea></div></div><button class="btn btn-primary" onclick="addItem()">保存する</button></div></div>
<div class="modal" id="soldModal"><div class="modal-inner"><div class="modal-head"><h3>売れた記録</h3><button class="close" onclick="closeModal('soldModal')">×</button></div><input type="hidden" id="soldId"><div class="form-row"><div><label>売値 ¥</label><input id="sPrice" type="number" inputmode="numeric" oninput="calcSoldPreview()"></div><div><label>売れた日</label><input id="sDate" type="date"></div></div><div class="form-row"><div><label>販売先</label><select id="sPlatform" onchange="calcSoldPreview()"><option value="mercari">メルカリ</option><option value="yahoo-flea">ヤフフリ</option><option value="yahoo-auction">ヤフオク</option><option value="other">その他</option></select></div><div><label>送料 ¥</label><input id="sShip" type="number" inputmode="numeric" oninput="calcSoldPreview()"></div></div><div class="form-row"><div><label>梱包費 ¥</label><input id="sMisc" type="number" inputmode="numeric" oninput="calcSoldPreview()"></div><div><label>&nbsp;</label><button class="btn btn-ghost" style="width:100%" onclick="openShipping()">送料表</button></div></div><div class="quick-row"><button class="btn btn-sm btn-ghost" onclick="setShip(210)">ネコポス210</button><button class="btn btn-sm btn-ghost" onclick="setShip(230)">ゆうパケット230</button><button class="btn btn-sm btn-ghost" onclick="setShip(750)">宅急便750</button><button class="btn btn-sm btn-ghost" onclick="setShip(0)">送料0</button></div><div class="calc-box" id="soldPreview"></div><button class="btn btn-green" style="width:100%" onclick="saveSold()">売却済みにする</button></div></div>
<div class="modal" id="editModal"><div class="modal-inner"><div class="modal-head"><h3>商品編集</h3><button class="close" onclick="closeModal('editModal')">×</button></div><input type="hidden" id="eId"><div class="form-row single"><div><label>商品名</label><input id="eName"></div></div><div class="form-row"><div><label>種類</label><select id="eType"><option value="sedori">せどり</option><option value="fuyohin">不用品</option></select></div><div><label>カテゴリ</label><select id="eCat"></select></div></div><div class="form-row"><div><label>仕入れ先</label><select id="eSource"></select></div><div><label>仕入れ値 ¥</label><input id="eCost" type="number" inputmode="numeric"></div></div><div class="form-row"><div><label>仕入れ日</label><input id="eDate" type="date"></div><div><label>ステータス</label><select id="eStatus" onchange="toggleEditSold()"><option value="unsold">仕入れ済み</option><option value="listed">出品中</option><option value="sold">売却済み</option><option value="shipped">発送済み</option></select></div></div><div id="editSoldArea"><div class="form-row"><div><label>売値 ¥</label><input id="ePrice" type="number" inputmode="numeric" oninput="calcEditPreview()"></div><div><label>売れた日</label><input id="eSoldDate" type="date"></div></div><div class="form-row"><div><label>販売先</label><select id="ePlatform" onchange="calcEditPreview()"><option value="mercari">メルカリ</option><option value="yahoo-flea">ヤフフリ</option><option value="yahoo-auction">ヤフオク</option><option value="other">その他</option></select></div><div><label>送料 ¥</label><input id="eShip" type="number" inputmode="numeric" oninput="calcEditPreview()"></div></div><div class="form-row"><div><label>梱包費 ¥</label><input id="eMisc" type="number" inputmode="numeric" oninput="calcEditPreview()"></div><div></div></div><div class="calc-box" id="editPreview"></div></div><div class="form-row single"><div><label>メモ</label><textarea id="eMemo"></textarea></div></div><div class="form-row"><button class="btn btn-blue" onclick="saveEdit()">保存</button><button class="btn btn-danger" onclick="deleteItemFromEdit()">削除</button></div></div></div>
<div class="modal" id="shipModal"><div class="modal-inner"><div class="modal-head"><h3>送料早見表</h3><button class="close" onclick="closeModal('shipModal')">×</button></div><div id="shipTable"></div><div class="mini-note">送料は変更される場合があります。実際の金額は売れた記録で手入力してください。</div></div></div>
<div class="modal" id="detailModal"><div class="modal-inner"><div class="modal-head"><h3 id="detailTitle">一覧</h3><button class="close" onclick="closeModal('detailModal')">×</button></div><div id="detailSummary"></div><div id="detailList"></div></div></div>
<script>
const CATS=['レトロゲーム','トレカ','ブランド品','古着','電子機器','本・漫画','おもちゃ','日用品','その他'];
const SOURCES=['不用品','ハードオフ','ブックオフ','メルカリ','ヤフオク','リサイクルショップ','フリマ','その他'];
const PLATFORM_FEE={mercari:.10,'yahoo-flea':.05,'yahoo-auction':.10,other:0};
const PLATFORM_NAME={mercari:'メルカリ','yahoo-flea':'ヤフフリ','yahoo-auction':'ヤフオク',other:'その他'};
const STATUS_NAME={unsold:'仕入れ済み',listed:'出品中',sold:'売却済み',shipped:'発送済み'};
let items=JSON.parse(localStorage.getItem('sedori_items')||'[]');
let mode='all',stockMode='sedori',analysisMode='sedori',viewDate=new Date(),csvSoldOnly=true,detailCache={};
function $(id){return document.getElementById(id)}function uid(){return Date.now()+Math.floor(Math.random()*9999)}
function normalize(){items=(items||[]).map(i=>{let type=i.type||(i.source==='不用品'?'fuyohin':'sedori');if(type==='personal')type='fuyohin';const rawStatus=String(i.status||i.state||i.statusName||'').trim();let status=rawStatus||'';const statusMap={'stock':'unsold','inventory':'unsold','unsold':'unsold','仕入れ済み':'unsold','未出品':'unsold','listed':'listed','listing':'listed','active':'listed','onSale':'listed','出品中':'listed','出品済み':'listed','sold':'sold','売却済み':'sold','売れた':'sold','shipped':'shipped','発送済み':'shipped','完了':'shipped'};status=statusMap[status]||status;const hasShippedFlag=!!(i.shipped||i.isShipped||i.shippedDate||i.deliveryDone);const hasSoldFlag=!!(i.sold||i.isSold||i.soldDate||i.sellDate||i.soldPrice||i.salePrice);const hasListedFlag=!!(i.listed||i.isListed||i.listedDate||i.listingDate||i.exhibited||i.isExhibited);if(!status){if(hasShippedFlag)status='shipped';else if(hasSoldFlag)status='shipped';else if(hasListedFlag)status='listed';else status='unsold'}if(!['unsold','listed','sold','shipped'].includes(status))status='unsold';let needShip=Boolean(i.needShip);if(status==='shipped'||hasShippedFlag)needShip=false;if(status==='sold'&&i.needShip===undefined&&rawStatus!=='sold')needShip=false;return{id:i.id||uid(),name:i.name||i.productName||'無題',cat:i.cat||i.category||'その他',source:i.source||'その他',type,cost:Number(i.cost||i.buyPrice||0),price:Number(i.price||i.sellPrice||i.listPrice||i.askingPrice||0),actualPrice:Number(i.actualPrice||i.soldPrice||i.salePrice||i.sellPrice||i.price||0),ship:Number(i.ship||i.shipping||i.shipCost||0),misc:Number(i.misc||i.packing||i.packCost||0),status,needShip,platform:i.platform||'mercari',feeRate:i.feeRate||undefined,date:i.date||i.buyDate||i.purchaseDate||today(),soldDate:i.soldDate||i.sellDate||i.shippedDate||'',memo:i.memo||''}})}
function save(){localStorage.setItem('sedori_items',JSON.stringify(items));$('saveMini').textContent='保存済み'}

function moveMonth(n){viewDate.setMonth(viewDate.getMonth()+n);renderAnalysis()}function renderAnalysis(){const target=ymDate(viewDate);const label=analysisMode==='sedori'?'せどり':'不用品';$('analysisMonth').textContent=target+' / '+label;const monthArr=soldItems(analysisMode).filter(i=>(i.soldDate||'').startsWith(target));const ms=summarize(monthArr);$('monthSummary').innerHTML=detailCard('analysis_profit','利益',yen(ms.profit),ms.profit>=0?'green':'red',monthArr,target+' 利益の内訳')+detailCard('analysis_sales','売上',yen(ms.sales),'orange',monthArr,target+' 売上一覧')+detailCard('analysis_count','販売数',ms.count+'件','blue',monthArr,target+' 販売商品')+detailCard('analysis_roi','ROI',pct(ms.roi),'purple',monthArr,target+' ROIの対象商品');renderMonthlyBars();renderYearTable();renderCatBars();renderPlatformBars();renderSoldHistory()}function groupBy(arr,keyFn){const m={};arr.forEach(i=>{const k=keyFn(i)||'未設定';(m[k]||(m[k]=[])).push(i)});return m}
function renderMonthlyBars(){const g=groupBy(soldItems(analysisMode),i=>(i.soldDate||'').slice(0,7));const rows=Object.keys(g).sort().reverse().slice(0,12).map(k=>({k,...summarize(g[k])}));const max=Math.max(1,...rows.map(r=>r.sales));$('monthlyBars').innerHTML=rows.length?rows.map(r=>barLine(r.k,r.sales,max,`${yen(r.sales)} / 利益 ${yen(r.profit)}`)).join(''):'<div class="empty">データなし</div>'}function renderYearTable(){const g=groupBy(soldItems(analysisMode),i=>(i.soldDate||'').slice(0,4));const rows=Object.keys(g).sort().reverse().map(k=>({k,...summarize(g[k])}));$('yearTable').innerHTML=rows.length?`<table class="table"><tr><th>年</th><th>売上</th><th>利益</th><th>数</th><th>ROI</th></tr>${rows.map(r=>`<tr><td>${r.k}</td><td>${yen(r.sales)}</td><td>${yen(r.profit)}</td><td>${r.count}</td><td>${pct(r.roi)}</td></tr>`).join('')}</table>`:'<div class="empty">データなし</div>'}
function renderCatBars(){const g=groupBy(soldItems(analysisMode),i=>i.cat);const rows=Object.keys(g).map(k=>({k,...summarize(g[k])})).sort((a,b)=>b.profit-a.profit);const max=Math.max(1,...rows.map(r=>Math.max(0,r.profit)));$('catBars').innerHTML=rows.length?rows.map(r=>barLine(r.k,Math.max(0,r.profit),max,`${yen(r.profit)} / ${r.count}件`)).join(''):'<div class="empty">データなし</div>'}function renderPlatformBars(){const g=groupBy(soldItems(analysisMode),i=>PLATFORM_NAME[i.platform]||'未設定');const rows=Object.keys(g).map(k=>({k,...summarize(g[k])})).sort((a,b)=>b.sales-a.sales);const max=Math.max(1,...rows.map(r=>r.sales));$('platformBars').innerHTML=rows.length?rows.map(r=>barLine(r.k,r.sales,max,`${yen(r.sales)} / 利益 ${yen(r.profit)}`)).join(''):'<div class="empty">データなし</div>'}function barLine(label,value,max,right){return `<div class="bar-line"><div>${label}</div><div class="bar-bg"><div class="bar" style="width:${Math.max(3,Math.round(value/max*100))}%"></div></div><div style="text-align:right">${right}</div></div>`}function renderSoldHistory(){const m=$('soldMonthFilter').value;let arr=soldItems(analysisMode).filter(i=>m==='all'||(i.soldDate||'').startsWith(m)).sort((a,b)=>(b.soldDate||'').localeCompare(a.soldDate||''));$('soldHistory').innerHTML=arr.length?arr.map(itemHtml).join(''):'<div class="empty">履歴なし</div>'}

function openDetail(key){const d=detailCache[key];if(!d)return;const arr=d.items||[];const sum=summarize(arr);$('detailTitle').textContent=d.title||'一覧';$('detailSummary').innerHTML=`<div class="detail-head"><div class="label">${escapeHtml(d.label||'合計')}</div><div class="big ${sum.profit>=0?'green':'red'}">${escapeHtml(d.value||yen(sum.profit))}</div><div class="mini-note">件数 ${arr.length}件 / 売上 ${yen(sum.sales)} / 利益 ${yen(sum.profit)} / 仕入れ ${yen(sum.cost)} / ROI ${pct(sum.roi)}</div></div>`;$('detailList').innerHTML=arr.length?arr.map(detailItemHtml).join(''):'<div class="empty">対象の商品はありません</div>';$('detailModal').classList.add('open')}
function detailItemHtml(it){const sold=it.status==='sold'||it.status==='shipped';const price=Number(it.actualPrice||it.price||0);const p=profitOf(it);return `<div class="detail-row" onclick="openEdit(${it.id})"><div class="detail-row-top"><div>${escapeHtml(it.name)}</div><div class="${sold?(p>=0?'green':'red'):'blue'}">${sold?yen(p):yen(it.cost)}</div></div><div class="detail-row-sub">${STATUS_NAME[it.status]||it.status} / ${it.type==='fuyohin'?'不用品':'せどり'} / ${escapeHtml(it.cat)}<br>${sold?'売上 '+yen(price)+' / 売れた日 '+(it.soldDate||'-')+' / 手数料 '+yen(fee(price,it.platform))+' / 送料 '+yen(it.ship):'仕入れ日 '+(it.date||'-')+' / 仕入れ先 '+escapeHtml(it.source)}${it.memo?'<br>'+escapeHtml(it.memo):''}</div></div>`}
function renderData(){$('dataCount').textContent=`全データ件数: ${items.length}件 / 売れた: ${soldItems('all').length}件 / 未販売: ${inventoryItems('all').length}件`;updateCsvPreview()}function makeCSV(){const start=$('csvStart').value,end=$('csvEnd').value;let arr=csvSoldOnly?soldItems('all'):[...items];arr=arr.filter(i=>{const d=(i.status==='sold'||i.status==='shipped'?i.soldDate:i.date)||'';const m=d.slice(0,7);return (!start||m>=start)&&(!end||m<=end)});const head=['商品名','種類','カテゴリ','仕入れ先','仕入れ日','状態','売れた日','売上','仕入れ値','送料','梱包費','手数料','利益','ROI','販売先','メモ'];const rows=arr.map(i=>[i.name,i.type==='fuyohin'?'不用品':'せどり',i.cat,i.source,i.date,STATUS_NAME[i.status]||i.status,i.soldDate,i.actualPrice||i.price||0,i.cost||0,i.ship||0,i.misc||0,fee(i.actualPrice||i.price||0,i.platform),profitOf(i),roiOf(i),PLATFORM_NAME[i.platform]||'',i.memo||'']);return [head,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n')}function setCsvMode(v){csvSoldOnly=v;$('csvSoldOnly').classList.toggle('active',v);$('csvAll').classList.toggle('active',!v);updateCsvPreview()}function updateCsvPreview(){if(!$('csvPreview'))return;const csv=makeCSV();$('csvPreview').textContent='プレビュー: '+csv.split('\n').slice(0,3).join(' / ')}function downloadCSV(){downloadBlob(new Blob(['\ufeff'+makeCSV()],{type:'text/csv'}),`sedori_${today()}.csv`);toast('CSVを保存しました')}function copyCSV(){navigator.clipboard.writeText(makeCSV()).then(()=>toast('CSVをコピーしました')).catch(()=>toast('コピーできませんでした'))}
function downloadBackup(){const data={version:'2026-06-16',items,goal:localStorage.getItem('sedori_goal')||0,exportedAt:new Date().toISOString()};downloadBlob(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),`sedori_backup_${today()}.json`);toast('バックアップを保存しました')}function restoreBackup(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);const next=Array.isArray(data)?data:data.items;if(!Array.isArray(next))throw new Error();if(!confirm('現在のデータを上書きして復元しますか？'))return;items=next;normalize();if(data.goal!==undefined)localStorage.setItem('sedori_goal',data.goal);save();renderAll();toast('復元しました')}catch{toast('復元できませんでした')}};r.readAsText(file)}function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function deleteAll(){if(!confirm('全データを削除しますか？'))return;if(!confirm('本当に削除します。バックアップは保存しましたか？'))return;items=[];save();renderAll();toast('全データを削除しました')}function openShipping(){const rows=[['ネコポス','小型','210円前後'],['ゆうパケット','小型','230円前後'],['宅急便コンパクト','専用箱','450円前後'],['宅急便/ゆうパック','60サイズ','750円前後〜'],['普通郵便','軽量','重量で変動']];$('shipTable').innerHTML=`<table class="table"><tr><th>種別</th><th>サイズ</th><th>送料</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table>`;$('shipModal').classList.add('open')}
init();
</script>
