<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>せどり管理</title>
<style>
:root{
  --bg:#f5f6fa;--card:#fff;--text:#1a1a2e;--muted:#7f8193;--border:#e4e6ef;
  --accent:#ff4d6d;--green:#00a878;--orange:#f0a500;--blue:#3f7ee8;--red:#e94b5f;
  --shadow:0 4px 16px rgba(20,20,40,.07);--radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);padding-bottom:84px;font-size:15px}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:12px 14px;display:flex;align-items:center;justify-content:space-between}
h1{font-size:1.1rem;font-weight:900}h1 span{color:var(--accent)}
.header-mini{font-size:.72rem;color:var(--muted);font-weight:700;text-align:right}.tabs{position:sticky;top:49px;z-index:19;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-bottom:1px solid var(--border)}
.tab{border:none;background:#fff;color:var(--muted);font-weight:800;font-size:.72rem;padding:10px 2px;border-bottom:3px solid transparent}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.page{display:none;padding:12px}.page.active{display:block}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.section-title{font-size:.85rem;color:var(--muted);font-weight:900;letter-spacing:.04em;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.summary-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:11px;box-shadow:var(--shadow)}
.summary-card .label{font-size:.69rem;color:var(--muted);font-weight:800}.summary-card .value{font-size:1.15rem;font-weight:900;margin-top:2px;font-variant-numeric:tabular-nums}.green{color:var(--green)}.orange{color:var(--orange)}.blue{color:var(--blue)}.red{color:var(--red)}.muted{color:var(--muted)}
.mode-toggle{display:flex;gap:4px;background:#eef0f6;border:1px solid var(--border);padding:4px;border-radius:12px;margin-bottom:10px}.mode-toggle button{flex:1;border:none;background:transparent;border-radius:9px;padding:8px 4px;font-weight:900;color:var(--muted)}.mode-toggle button.active{background:var(--accent);color:#fff}
label{display:block;font-size:.72rem;color:var(--muted);font-weight:800;margin:0 0 4px 2px}input,select,textarea{width:100%;border:1px solid var(--border);background:#f8f9fc;border-radius:11px;padding:10px;font-size:16px;font-family:inherit;color:var(--text)}textarea{min-height:64px;resize:vertical}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:#fff}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.form-row.single{grid-template-columns:1fr}.form-row.triple{grid-template-columns:1fr 1fr 1fr}
.btn{border:none;border-radius:12px;padding:11px 12px;font-weight:900;font-family:inherit;font-size:.9rem}.btn-primary{background:var(--accent);color:#fff;width:100%}.btn-green{background:var(--green);color:#fff}.btn-blue{background:var(--blue);color:#fff}.btn-ghost{background:#f3f4f8;color:var(--text);border:1px solid var(--border)}.btn-danger{background:#fff0f2;color:var(--red);border:1px solid #ffd2d8}.btn-sm{padding:7px 9px;font-size:.76rem;border-radius:9px}.quick-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;margin-bottom:10px}.quick-row button{white-space:nowrap}
.filter-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.filter-bar .wide{grid-column:1/3}.item-list{display:flex;flex-direction:column;gap:9px}.item{background:#fff;border:1px solid var(--border);border-radius:15px;padding:12px;box-shadow:var(--shadow)}.item-top{display:flex;justify-content:space-between;gap:8px}.item-name{font-weight:900;line-height:1.35}.badge{display:inline-block;font-size:.68rem;font-weight:900;border-radius:999px;padding:3px 7px;background:#f1f2f7;color:var(--muted);margin:4px 4px 0 0}.badge.sold{background:#e9fff7;color:var(--green)}.badge.unsold{background:#fff4df;color:#b37500}.item-meta{font-size:.76rem;color:var(--muted);line-height:1.65;margin-top:6px}.item-actions{display:flex;gap:7px;margin-top:9px}.item-actions button{flex:1}.calc-box{background:#f8f9fc;border:1px solid var(--border);border-radius:13px;padding:10px;margin:8px 0;display:grid;grid-template-columns:1fr 1fr;gap:7px}.calc-row{display:flex;justify-content:space-between;font-size:.78rem}.calc-row b{font-variant-numeric:tabular-nums}.bar-wrap{display:flex;flex-direction:column;gap:8px}.bar-line{display:grid;grid-template-columns:72px 1fr 82px;gap:8px;align-items:center;font-size:.78rem}.bar-bg{height:12px;background:#eef0f6;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--accent);border-radius:999px}.table{width:100%;border-collapse:collapse;font-size:.78rem}.table th,.table td{border-bottom:1px solid var(--border);padding:8px 4px;text-align:right}.table th:first-child,.table td:first-child{text-align:left}.table th{color:var(--muted);font-size:.7rem}.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.month-nav b{font-size:1rem}.empty{text-align:center;color:var(--muted);padding:22px 8px;font-weight:800}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#1f2230;color:#fff;border-radius:999px;padding:10px 16px;font-weight:900;font-size:.82rem;z-index:50;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;align-items:flex-end}.modal.open{display:flex}.modal-inner{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modal-head h3{font-size:1rem}.close{border:none;background:#f1f2f7;border-radius:50%;width:34px;height:34px;font-weight:900}.danger-zone{border:1px dashed #ffb5bf;background:#fff7f8}.mini-note{font-size:.72rem;color:var(--muted);line-height:1.5;margin-top:6px}.progress{height:9px;background:#eceef5;border-radius:999px;overflow:hidden;margin-top:7px}.progress div{height:100%;background:var(--green);border-radius:999px}.fixed-add{position:fixed;right:14px;bottom:18px;z-index:22;background:var(--accent);color:#fff;border:none;border-radius:999px;padding:14px 16px;font-weight:900;box-shadow:0 8px 22px rgba(255,77,109,.35)}
@media(min-width:760px){body{max-width:760px;margin:0 auto}.modal{align-items:center}.modal-inner{max-width:720px;margin:auto;border-radius:22px}.fixed-add{left:calc(50% + 290px);right:auto}}
</style>
</head>
<body>
<header><h1>せどり<span>管理</span></h1><div class="header-mini" id="todayMini"></div></header>
<nav class="tabs">
<button class="tab active" data-page="home" onclick="showPage('home')">ホーム</button>
<button class="tab" data-page="stock" onclick="showPage('stock')">在庫</button>
<button class="tab" data-page="analysis" onclick="showPage('analysis')">分析</button>
<button class="tab" data-page="data" onclick="showPage('data')">データ</button>
</nav>

<main>
<section id="home" class="page active">
  <div class="mode-toggle"><button class="active" onclick="setMode('all',this)">全体</button><button onclick="setMode('sedori',this)">せどり</button><button onclick="setMode('fuyohin',this)">不用品</button></div>
  <div class="grid2" id="homeSummary"></div>
  <div class="card">
    <div class="section-title">今月の目標</div>
    <div class="form-row"><div><label>目標利益 ¥</label><input id="goalInput" type="number" inputmode="numeric"></div><div style="display:flex;align-items:end"><button class="btn btn-primary" onclick="saveGoal()">設定</button></div></div>
    <div id="goalView"></div>
  </div>
  <div class="card">
    <div class="section-title">今までの売上・利益</div>
    <div class="grid2" id="lifetimeSummary"></div>
  </div>
  <div class="card">
    <div class="section-title">最近売れた商品 <button class="btn btn-sm btn-ghost" onclick="showPage('analysis')">もっと見る</button></div>
    <div id="recentSold"></div>
  </div>
</section>


<section id="stock" class="page">
  <div class="mode-toggle" id="stockModeToggle"><button class="active" onclick="setStockMode('sedori',this)">せどり</button><button onclick="setStockMode('fuyohin',this)">不用品</button></div>
  <button class="btn btn-primary" style="width:100%;margin-bottom:10px" onclick="openAddModal()">＋ 商品追加</button>
  <div class="filter-bar">
    <select id="filterStatus" onchange="renderStock()"><option value="unsold">未販売</option><option value="all">全て</option><option value="sold">売れた</option></select>
    <select id="filterCat" onchange="renderStock()"><option value="">全カテゴリ</option></select>
    <input id="filterSearch" class="wide" placeholder="商品名・メモ検索" oninput="renderStock()">
  </div>
  <div class="grid2" id="stockSummary" style="margin-bottom:10px"></div>
  <div id="stockList" class="item-list"></div>
</section>

<section id="analysis" class="page">
  <div class="mode-toggle" id="analysisModeToggle"><button class="active" onclick="setAnalysisMode('sedori',this)">せどり</button><button onclick="setAnalysisMode('fuyohin',this)">不用品</button></div>
  <div class="card">
    <div class="month-nav"><button class="btn btn-sm btn-ghost" onclick="moveMonth(-1)">◀</button><b id="analysisMonth"></b><button class="btn btn-sm btn-ghost" onclick="moveMonth(1)">▶</button></div>
    <div class="grid2" id="monthSummary"></div>
  </div>
  <div class="card"><div class="section-title">月別 売上・利益</div><div id="monthlyBars" class="bar-wrap"></div></div>
  <div class="card"><div class="section-title">年別 売上・利益</div><div id="yearTable"></div></div>
  <div class="card"><div class="section-title">カテゴリ別 利益</div><div id="catBars" class="bar-wrap"></div></div>
  <div class="card"><div class="section-title">販売先別 売上</div><div id="platformBars" class="bar-wrap"></div></div>
  <div class="card"><div class="section-title">売れた履歴</div><div class="filter-bar"><select id="soldMonthFilter" class="wide" onchange="renderSoldHistory()"><option value="all">全期間</option></select></div><div id="soldHistory" class="item-list"></div></div>
</section>

<section id="data" class="page">
  <div class="card"><div class="section-title">バックアップ</div><button class="btn btn-blue" style="width:100%" onclick="downloadBackup()">バックアップを保存（JSON）</button><label style="margin-top:12px">バックアップから復元</label><input type="file" accept="application/json" onchange="restoreBackup(event)"><div class="mini-note">復元すると現在のデータは上書きされます。</div></div>
  <div class="card"><div class="section-title">CSV出力</div><div class="form-row"><div><label>開始月</label><input id="csvStart" type="month"></div><div><label>終了月</label><input id="csvEnd" type="month"></div></div><div class="mode-toggle"><button class="active" id="csvSoldOnly" onclick="setCsvMode(true)">売れた商品のみ</button><button id="csvAll" onclick="setCsvMode(false)">全商品</button></div><button class="btn btn-primary" onclick="downloadCSV()">CSVダウンロード</button><button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="copyCSV()">全件コピー</button><div id="csvPreview" class="mini-note"></div></div>
  <div class="card danger-zone"><div class="section-title">データ管理</div><div id="dataCount" class="mini-note"></div><button class="btn btn-danger" style="width:100%;margin-top:10px" onclick="deleteAll()">全データを削除</button></div>
</section>
</main>

<button class="fixed-add" onclick="openAddModal()">＋商品追加</button>
<div class="toast" id="toast"></div>

<div class="modal" id="soldModal"><div class="modal-inner"><div class="modal-head"><h3>売れた！</h3><button class="close" onclick="closeModal('soldModal')">×</button></div>
  <input type="hidden" id="soldId">
  <div class="form-row"><div><label>販売先</label><select id="sPlatform" onchange="calcSoldPreview()"><option value="mercari">メルカリ（10%）</option><option value="yahoo-flea">ヤフフリ（5%）</option><option value="yahoo-auction">ヤフオク（10%）</option><option value="other">その他（10%）</option></select></div><div><label>売れた日</label><input id="sDate" type="date"></div></div>
  <div class="form-row triple"><div><label>売値 ¥</label><input id="sPrice" type="number" inputmode="numeric" oninput="calcSoldPreview()"></div><div><label>送料 ¥</label><input id="sShip" type="number" inputmode="numeric" oninput="calcSoldPreview()"></div><div><label>梱包費 ¥</label><input id="sMisc" type="number" inputmode="numeric" oninput="calcSoldPreview()"></div></div>
  <div class="quick-row"><button class="btn btn-sm btn-ghost" onclick="setShip(210)">ネコポス210</button><button class="btn btn-sm btn-ghost" onclick="setShip(230)">ゆうパケット230</button><button class="btn btn-sm btn-ghost" onclick="setShip(750)">宅急便750</button><button class="btn btn-sm btn-ghost" onclick="setShip(0)">送料0</button></div>
  <div class="calc-box" id="soldPreview"></div><button class="btn btn-green" style="width:100%" onclick="saveSold()">記録する</button>
</div></div>

<div class="modal" id="editModal"><div class="modal-inner"><div class="modal-head"><h3>商品を編集</h3><button class="close" onclick="closeModal('editModal')">×</button></div>
  <input type="hidden" id="eId"><div class="form-row single"><div><label>商品名</label><input id="eName"></div></div>
  <div class="form-row"><div><label>カテゴリ</label><select id="eCat"></select></div><div><label>仕入れ先</label><select id="eSource"></select></div></div>
  <div class="form-row triple"><div><label>仕入れ値 ¥</label><input id="eCost" type="number" oninput="calcEditPreview()"></div><div><label>送料 ¥</label><input id="eShip" type="number" oninput="calcEditPreview()"></div><div><label>梱包費 ¥</label><input id="eMisc" type="number" oninput="calcEditPreview()"></div></div>
  <div class="form-row"><div><label>仕入れ日</label><input id="eDate" type="date"></div><div><label>ステータス</label><select id="eStatus" onchange="toggleEditSold()"><option value="unsold">未販売</option><option value="sold">売れた</option></select></div></div>
  <div id="editSoldArea"><div class="form-row"><div><label>売れた日</label><input id="eSoldDate" type="date"></div><div><label>実際の売値 ¥</label><input id="ePrice" type="number" oninput="calcEditPreview()"></div></div><div class="form-row single"><div><label>販売先</label><select id="ePlatform" onchange="calcEditPreview()"><option value="mercari">メルカリ（10%）</option><option value="yahoo-flea">ヤフフリ（5%）</option><option value="yahoo-auction">ヤフオク（10%）</option><option value="other">その他（10%）</option></select></div></div><div class="calc-box" id="editPreview"></div></div>
  <div class="form-row single"><div><label>メモ</label><textarea id="eMemo"></textarea></div></div><button class="btn btn-primary" onclick="saveEdit()">保存する</button>
</div></div>

<div class="modal" id="addModal"><div class="modal-inner"><div class="modal-head"><h3>商品追加</h3><button class="close" onclick="closeModal('addModal')">×</button></div>
  <div class="mini-note" id="addModeNote"></div>
  <div class="quick-row" id="quickSources"></div>
  <div id="lastCarry" class="mini-note" style="display:none"></div>
  <div class="form-row single"><div><label>商品名</label><input id="fName" placeholder="例：Switch ソフト"></div></div>
  <div class="form-row"><div><label>仕入れ値 ¥</label><input id="fCost" type="number" inputmode="numeric"></div><div><label>仕入れ日</label><input id="fDate" type="date"></div></div>
  <div class="form-row"><div><label>カテゴリ</label><select id="fCat"></select></div><div><label>仕入れ先</label><select id="fSource" onchange="highlightQuickSource()"></select></div></div>
  <div class="form-row single"><div><label>メモ</label><textarea id="fMemo" placeholder="型番・状態・付属品など"></textarea></div></div>
  <button class="btn btn-primary" onclick="addItem()">商品を追加する</button>
  <button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="openShipping()">送料を確認する</button>
</div></div>

<div class="modal" id="shipModal"><div class="modal-inner"><div class="modal-head"><h3>送料早見表</h3><button class="close" onclick="closeModal('shipModal')">×</button></div><div id="shipTable"></div><div class="mini-note">送料は変わる場合があります。実際の発送前に各サービスで確認してください。</div></div></div>

<script>
const CATS=['レトロゲーム','トレカ','ブランド品','古着','電子機器','本・漫画','おもちゃ','その他'];
const SOURCES=['不用品','ハードオフ','ブックオフ','メルカリ','ヤフオク','リサイクルショップ','フリマ','その他'];
const PLATFORM_FEE={mercari:.10,'yahoo-flea':.05,'yahoo-auction':.10,other:.10};
const PLATFORM_NAME={mercari:'メルカリ','yahoo-flea':'ヤフフリ','yahoo-auction':'ヤフオク',other:'その他'};
let items=JSON.parse(localStorage.getItem('sedori_items')||'[]');
let mode='all';let stockMode='sedori';let analysisMode='sedori';let viewDate=new Date();let csvSoldOnly=true;
function $(id){return document.getElementById(id)}
function save(){localStorage.setItem('sedori_items',JSON.stringify(items))}
function yen(n){return '¥'+Math.round(Number(n)||0).toLocaleString()}
function pct(n){return (Math.round(Number(n)||0)).toLocaleString()+'%'}
function today(){return new Date().toISOString().slice(0,10)}
function ym(d){return d.toISOString().slice(0,7)}
function isSedori(it){return it.source!=='不用品'}
function matchMode(it,m=mode){if(m==='sedori')return isSedori(it);if(m==='fuyohin')return !isSedori(it);return true}
function feeRate(p){return PLATFORM_FEE[p]??.10}
function fee(price,platform){return Math.round((Number(price)||0)*feeRate(platform))}
function profitOf(it){if(it.status!=='sold')return 0;const price=Number(it.actualPrice||it.price||0);return price-fee(price,it.platform)-Number(it.cost||0)-Number(it.ship||0)-Number(it.misc||0)}
function roiOf(it){const c=Number(it.cost||0);return c?Math.round(profitOf(it)/c*100):0}
function soldItems(m='all'){return items.filter(i=>i.status==='sold'&&matchMode(i,m))}
function inventoryItems(m='all'){return items.filter(i=>i.status!=='sold'&&matchMode(i,m))}
function summarize(arr){let sales=0,profit=0,cost=0,ship=0,misc=0,fees=0;arr.forEach(i=>{const price=Number(i.actualPrice||i.price||0);sales+=i.status==='sold'?price:0;profit+=profitOf(i);cost+=Number(i.cost||0);ship+=Number(i.ship||0);misc+=Number(i.misc||0);fees+=i.status==='sold'?fee(price,i.platform):0});return{sales,profit,cost,ship,misc,fees,count:arr.length,roi:cost?Math.round(profit/cost*100):0}}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function fillSelect(id,arr,val){$(id).innerHTML=arr.map(x=>`<option value="${x}">${x}</option>`).join('');if(val)$(id).value=val}
function init(){fillSelect('fCat',CATS);fillSelect('fSource',SOURCES);fillSelect('eCat',CATS);fillSelect('eSource',SOURCES);$('fDate').value=today();$('sDate').value=today();$('todayMini').textContent=new Date().toLocaleDateString('ja-JP',{month:'numeric',day:'numeric',weekday:'short'});$('goalInput').value=localStorage.getItem('sedori_goal')||'';renderQuickSources();renderAll();}
function renderAll(){updateFilters();renderHome();renderStock();renderAnalysis();renderData();updateLastCarry()}
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.page===id));window.scrollTo({top:0,behavior:'smooth'});renderAll()}
function setMode(m,btn){mode=m;document.querySelectorAll('#home .mode-toggle button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderHome()}
function setStockMode(m,btn){stockMode=m;document.querySelectorAll('#stockModeToggle button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderStock()}
function setAnalysisMode(m,btn){analysisMode=m;document.querySelectorAll('#analysisModeToggle button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderAnalysis()}
function card(label,value,cls=''){return `<div class="summary-card"><div class="label">${label}</div><div class="value ${cls}">${value}</div></div>`}
function renderHome(){const nowYm=ym(new Date());const monthSold=soldItems(mode).filter(i=>(i.soldDate||'').startsWith(nowYm));const ms=summarize(monthSold);const inv=inventoryItems(mode);const invSum=summarize(inv);$('homeSummary').innerHTML=card('今月利益',yen(ms.profit),'green')+card('今月売上',yen(ms.sales),'orange')+card('在庫数',inv.length+'件','blue')+card('今月ROI',pct(ms.roi),'red')+card('在庫仕入れ総額',yen(invSum.cost))+card('平均仕入れ値',yen(inv.length?invSum.cost/inv.length:0));const life=summarize(soldItems(mode));$('lifetimeSummary').innerHTML=card('累計売上',yen(life.sales),'orange')+card('累計利益',yen(life.profit),'green')+card('累計販売数',life.count+'件','blue')+card('累計ROI',pct(life.roi),'red');renderGoal(ms.profit);renderRecentSold()}
function saveGoal(){localStorage.setItem('sedori_goal',Number($('goalInput').value)||0);renderHome();toast('目標を設定しました')}
function renderGoal(nowProfit){const g=Number(localStorage.getItem('sedori_goal')||0);if(!g){$('goalView').innerHTML='<div class="mini-note">目標を設定すると達成率が表示されます。</div>';return}const rate=Math.min(100,Math.round(nowProfit/g*100));$('goalView').innerHTML=`<div class="mini-note">${yen(nowProfit)} / ${yen(g)}　達成率 ${rate}%</div><div class="progress"><div style="width:${rate}%"></div></div>`}
function renderRecentSold(){const arr=soldItems(mode).sort((a,b)=>(b.soldDate||'').localeCompare(a.soldDate||'')).slice(0,5);$('recentSold').innerHTML=arr.length?arr.map(itemHtml).join(''):'<div class="empty">まだ売れた商品がありません</div>'}
function renderQuickSources(){$('quickSources').innerHTML=SOURCES.map(s=>`<button class="btn btn-sm btn-ghost quick-src" onclick="setQuickSource('${s}')">${s}</button>`).join('')}
function setQuickSource(s){$('fSource').value=s;highlightQuickSource()}
function highlightQuickSource(){document.querySelectorAll('.quick-src').forEach(b=>b.classList.toggle('btn-primary',b.textContent===$('fSource').value))}
function updateLastCarry(){const last=JSON.parse(localStorage.getItem('sedori_last_entry')||'null');if(!last){$('lastCarry').style.display='none';return}$('lastCarry').style.display='block';$('lastCarry').innerHTML=`前回: ${last.source} / ${last.cat} <button class="btn btn-sm btn-ghost" onclick="applyLastCarry()">引き継ぐ</button>`}
function applyLastCarry(){const last=JSON.parse(localStorage.getItem('sedori_last_entry')||'null');if(!last)return;$('fCat').value=last.cat;$('fSource').value=last.source;$('fMemo').value=last.memo||'';highlightQuickSource();toast('前回内容を引き継ぎました')}
function openAddModal(){const sourceDefault=stockMode==='fuyohin'?'不用品':($('fSource').value==='不用品'?'ハードオフ':($('fSource').value||'ハードオフ'));$('fSource').value=sourceDefault;$('fDate').value=$('fDate').value||today();$('addModeNote').textContent=(stockMode==='fuyohin'?'不用品':'せどり')+'として在庫に追加します。';highlightQuickSource();updateLastCarry();$('addModal').classList.add('open');setTimeout(()=>$('fName').focus(),80)}
function addItem(){const name=$('fName').value.trim();if(!name){toast('商品名を入力してください');return}const item={id:Date.now(),name,cat:$('fCat').value,source:$('fSource').value,cost:Number($('fCost').value)||0,price:0,actualPrice:0,ship:0,misc:0,status:'unsold',platform:'mercari',feeRate:.10,date:$('fDate').value||today(),soldDate:'',memo:$('fMemo').value.trim()};items.unshift(item);localStorage.setItem('sedori_last_entry',JSON.stringify({cat:item.cat,source:item.source,memo:item.memo}));save();$('fName').value='';$('fCost').value='';$('fMemo').value='';$('fDate').value=today();closeModal('addModal');showPage('stock');renderAll();toast('商品を追加しました')}
function updateFilters(){const cats=[...new Set(items.map(i=>i.cat).filter(Boolean))];const opts='<option value="">全カテゴリ</option>'+cats.map(c=>`<option value="${c}">${c}</option>`).join('');const cur=$('filterCat').value;$('filterCat').innerHTML=opts;$('filterCat').value=cur;if($('filterCat').value!==cur)$('filterCat').value='';const months=[...new Set(soldItems('all').map(i=>(i.soldDate||'').slice(0,7)).filter(Boolean))].sort().reverse();const cm=$('soldMonthFilter').value;$('soldMonthFilter').innerHTML='<option value="all">全期間</option>'+months.map(m=>`<option value="${m}">${m}</option>`).join('');$('soldMonthFilter').value=cm||'all'}
function renderStock(){const st=$('filterStatus').value,cat=$('filterCat').value,q=$('filterSearch').value.trim().toLowerCase();let arr=items.filter(i=>matchMode(i,stockMode)&&(st==='all'||i.status===st)&&(!cat||i.cat===cat)&&(!q||((i.name||'')+(i.memo||'')).toLowerCase().includes(q)));const inv=inventoryItems(stockMode), sold=soldItems(stockMode);const label=stockMode==='sedori'?'せどり':'不用品';$('stockSummary').innerHTML=card(label+' 未販売',inv.length+'件','blue')+card(label+' 売れた',sold.length+'件','green');$('stockList').innerHTML=arr.length?arr.map(itemHtml).join(''):'<div class="empty">商品がありません</div>'}
function itemHtml(it){const sold=it.status==='sold';return `<div class="item"><div class="item-top"><div><div class="item-name">${escapeHtml(it.name)}</div><span class="badge ${sold?'sold':'unsold'}">${sold?'売れた':'未販売'}</span><span class="badge">${it.cat}</span><span class="badge">${it.source}</span></div><div style="text-align:right;font-weight:900" class="${sold?(profitOf(it)>=0?'green':'red'):'blue'}">${sold?yen(profitOf(it)):yen(it.cost)}</div></div><div class="item-meta">仕入れ日: ${it.date||'-'}${sold?' / 売れた日: '+(it.soldDate||'-')+' / 売上: '+yen(it.actualPrice||it.price):''}<br>${it.memo?escapeHtml(it.memo):''}</div><div class="item-actions">${sold?'':`<button class="btn btn-sm btn-green" onclick="openSold(${it.id})">売れた</button>`}<button class="btn btn-sm btn-ghost" onclick="openEdit(${it.id})">編集</button><button class="btn btn-sm btn-danger" onclick="deleteItem(${it.id})">削除</button></div></div>`}
function escapeHtml(s){return String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function openSold(id){const it=items.find(i=>i.id===id);if(!it)return;$('soldId').value=id;$('sPrice').value='';$('sShip').value='';$('sMisc').value='';$('sDate').value=today();$('sPlatform').value='mercari';calcSoldPreview();$('soldModal').classList.add('open')}
function setShip(n){$('sShip').value=n;calcSoldPreview()}
function calcSoldPreview(){const it=items.find(i=>i.id===$('soldId').value);const price=Number($('sPrice').value)||0, ship=Number($('sShip').value)||0, misc=Number($('sMisc').value)||0, cost=Number(it?.cost||0), pf=fee(price,$('sPlatform').value), p=price-pf-cost-ship-misc, roi=cost?Math.round(p/cost*100):0;$('soldPreview').innerHTML=`<div class="calc-row"><span>手数料</span><b>${yen(pf)}</b></div><div class="calc-row"><span>仕入れ値</span><b>${yen(cost)}</b></div><div class="calc-row"><span>利益</span><b class="${p>=0?'green':'red'}">${yen(p)}</b></div><div class="calc-row"><span>ROI</span><b>${pct(roi)}</b></div>`}
function saveSold(){const it=items.find(i=>i.id===$('soldId').value);if(!it)return;const price=Number($('sPrice').value)||0;if(!price){toast('売値を入力してください');return}it.status='sold';it.actualPrice=price;it.price=price;it.ship=Number($('sShip').value)||0;it.misc=Number($('sMisc').value)||0;it.soldDate=$('sDate').value||today();it.platform=$('sPlatform').value;it.feeRate=feeRate(it.platform);save();closeModal('soldModal');renderAll();toast('売れた記録を保存しました')}
function deleteItem(id){if(!confirm('削除しますか？'))return;items=items.filter(i=>i.id!==id);save();renderAll();toast('削除しました')}
function openEdit(id){const it=items.find(i=>i.id===id);if(!it)return;$('eId').value=id;$('eName').value=it.name;$('eCat').value=it.cat;$('eSource').value=it.source;$('eCost').value=it.cost||0;$('eShip').value=it.ship||0;$('eMisc').value=it.misc||0;$('eDate').value=it.date||today();$('eStatus').value=it.status||'unsold';$('eSoldDate').value=it.soldDate||today();$('ePrice').value=it.actualPrice||it.price||'';$('ePlatform').value=it.platform||'mercari';$('eMemo').value=it.memo||'';toggleEditSold();$('editModal').classList.add('open')}
function toggleEditSold(){$('editSoldArea').style.display=$('eStatus').value==='sold'?'block':'none';calcEditPreview()}
function calcEditPreview(){const price=Number($('ePrice').value)||0,cost=Number($('eCost').value)||0,ship=Number($('eShip').value)||0,misc=Number($('eMisc').value)||0,pf=fee(price,$('ePlatform').value),p=price-pf-cost-ship-misc,roi=cost?Math.round(p/cost*100):0;$('editPreview').innerHTML=`<div class="calc-row"><span>手数料</span><b>${yen(pf)}</b></div><div class="calc-row"><span>仕入れ値</span><b>${yen(cost)}</b></div><div class="calc-row"><span>利益</span><b class="${p>=0?'green':'red'}">${yen(p)}</b></div><div class="calc-row"><span>ROI</span><b>${pct(roi)}</b></div>`}
function saveEdit(){const it=items.find(i=>i.id===$('eId').value);if(!it)return;it.name=$('eName').value.trim()||it.name;it.cat=$('eCat').value;it.source=$('eSource').value;it.cost=Number($('eCost').value)||0;it.ship=Number($('eShip').value)||0;it.misc=Number($('eMisc').value)||0;it.date=$('eDate').value||today();it.status=$('eStatus').value;it.memo=$('eMemo').value.trim();if(it.status==='sold'){it.soldDate=$('eSoldDate').value||today();it.actualPrice=Number($('ePrice').value)||0;it.price=it.actualPrice;it.platform=$('ePlatform').value;it.feeRate=feeRate(it.platform)}else{it.soldDate='';it.actualPrice=0;it.price=0}save();closeModal('editModal');renderAll();toast('保存しました')}
function closeModal(id){$(id).classList.remove('open')}
function moveMonth(n){viewDate.setMonth(viewDate.getMonth()+n);renderAnalysis()}
function renderAnalysis(){const target=ym(viewDate);const label=analysisMode==='sedori'?'せどり':'不用品';$('analysisMonth').textContent=target+' / '+label;const monthArr=soldItems(analysisMode).filter(i=>(i.soldDate||'').startsWith(target));const ms=summarize(monthArr);$('monthSummary').innerHTML=card('利益',yen(ms.profit),'green')+card('売上',yen(ms.sales),'orange')+card('販売数',ms.count+'件','blue')+card('ROI',pct(ms.roi),'red');renderMonthlyBars();renderYearTable();renderCatBars();renderPlatformBars();renderSoldHistory()}
function groupBy(arr,keyFn){const m={};arr.forEach(i=>{const k=keyFn(i)||'未設定';(m[k]||(m[k]=[])).push(i)});return m}
function renderMonthlyBars(){const g=groupBy(soldItems(analysisMode),i=>(i.soldDate||'').slice(0,7));const rows=Object.keys(g).sort().reverse().slice(0,12).map(k=>({k,...summarize(g[k])}));const max=Math.max(1,...rows.map(r=>r.sales));$('monthlyBars').innerHTML=rows.length?rows.map(r=>barLine(r.k,r.sales,max,`${yen(r.sales)} / 利益 ${yen(r.profit)}`)).join(''):'<div class="empty">データなし</div>'}
function renderYearTable(){const g=groupBy(soldItems(analysisMode),i=>(i.soldDate||'').slice(0,4));const rows=Object.keys(g).sort().reverse().map(k=>({k,...summarize(g[k])}));$('yearTable').innerHTML=rows.length?`<table class="table"><tr><th>年</th><th>売上</th><th>利益</th><th>数</th><th>ROI</th></tr>${rows.map(r=>`<tr><td>${r.k}</td><td>${yen(r.sales)}</td><td>${yen(r.profit)}</td><td>${r.count}</td><td>${pct(r.roi)}</td></tr>`).join('')}</table>`:'<div class="empty">データなし</div>'}
function renderCatBars(){const g=groupBy(soldItems(analysisMode),i=>i.cat);const rows=Object.keys(g).map(k=>({k,...summarize(g[k])})).sort((a,b)=>b.profit-a.profit);const max=Math.max(1,...rows.map(r=>Math.max(0,r.profit)));$('catBars').innerHTML=rows.length?rows.map(r=>barLine(r.k,Math.max(0,r.profit),max,`${yen(r.profit)} / ${r.count}件`)).join(''):'<div class="empty">データなし</div>'}
function renderPlatformBars(){const g=groupBy(soldItems(analysisMode),i=>PLATFORM_NAME[i.platform]||'未設定');const rows=Object.keys(g).map(k=>({k,...summarize(g[k])})).sort((a,b)=>b.sales-a.sales);const max=Math.max(1,...rows.map(r=>r.sales));$('platformBars').innerHTML=rows.length?rows.map(r=>barLine(r.k,r.sales,max,`${yen(r.sales)} / 利益 ${yen(r.profit)}`)).join(''):'<div class="empty">データなし</div>'}
function barLine(label,value,max,right){return `<div class="bar-line"><div>${label}</div><div class="bar-bg"><div class="bar" style="width:${Math.max(3,Math.round(value/max*100))}%"></div></div><div style="text-align:right">${right}</div></div>`}
function renderSoldHistory(){const m=$('soldMonthFilter').value;let arr=soldItems(analysisMode).filter(i=>m==='all'||(i.soldDate||'').startsWith(m)).sort((a,b)=>(b.soldDate||'').localeCompare(a.soldDate||''));$('soldHistory').innerHTML=arr.length?arr.map(itemHtml).join(''):'<div class="empty">履歴なし</div>'}
function renderData(){$('dataCount').textContent=`全データ件数: ${items.length}件 / 売れた: ${soldItems('all').length}件 / 未販売: ${inventoryItems('all').length}件`;updateCsvPreview()}
function makeCSV(){const start=$('csvStart').value,end=$('csvEnd').value;let arr=csvSoldOnly?soldItems('all'):[...items];arr=arr.filter(i=>{const d=(i.status==='sold'?i.soldDate:i.date)||'';const m=d.slice(0,7);return (!start||m>=start)&&(!end||m<=end)});const head=['商品名','カテゴリ','仕入れ先','仕入れ日','状態','売れた日','売上','仕入れ値','送料','梱包費','手数料','利益','ROI','販売先','メモ'];const rows=arr.map(i=>[i.name,i.cat,i.source,i.date,i.status==='sold'?'売れた':'未販売',i.soldDate,i.actualPrice||i.price||0,i.cost||0,i.ship||0,i.misc||0,fee(i.actualPrice||i.price||0,i.platform),profitOf(i),roiOf(i),PLATFORM_NAME[i.platform]||'',i.memo||'']);return [head,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n')}
function setCsvMode(v){csvSoldOnly=v;$('csvSoldOnly').classList.toggle('active',v);$('csvAll').classList.toggle('active',!v);updateCsvPreview()}
function updateCsvPreview(){if(!$('csvPreview'))return;const csv=makeCSV();$('csvPreview').textContent='プレビュー: '+csv.split('\n').slice(0,3).join(' / ')}
function downloadCSV(){const blob=new Blob(['\ufeff'+makeCSV()],{type:'text/csv'});downloadBlob(blob,`sedori_${today()}.csv`);toast('CSVを保存しました')}
function copyCSV(){navigator.clipboard.writeText(makeCSV()).then(()=>toast('CSVをコピーしました')).catch(()=>toast('コピーできませんでした'))}
function downloadBackup(){const data={version:'2026-06-11',items,goal:localStorage.getItem('sedori_goal')||0,exportedAt:new Date().toISOString()};downloadBlob(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),`sedori_backup_${today()}.json`);toast('バックアップを保存しました')}
function restoreBackup(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);const next=Array.isArray(data)?data:data.items;if(!Array.isArray(next))throw new Error();if(!confirm('現在のデータを上書きして復元しますか？'))return;items=next;if(data.goal!==undefined)localStorage.setItem('sedori_goal',data.goal);save();renderAll();toast('復元しました')}catch{toast('復元できませんでした')}};r.readAsText(file)}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function deleteAll(){if(!confirm('全データを削除しますか？'))return;if(!confirm('本当に削除します。バックアップは保存しましたか？'))return;items=[];save();renderAll();toast('全データを削除しました')}
function openShipping(){const rows=[['ネコポス','小型','210円前後'],['ゆうパケット','小型','230円前後'],['宅急便コンパクト','専用箱','450円前後'],['宅急便/ゆうパック','60サイズ','750円前後〜'],['普通郵便','軽量','重量で変動']];$('shipTable').innerHTML=`<table class="table"><tr><th>種別</th><th>サイズ</th><th>送料</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table>`;$('shipModal').classList.add('open')}
init();
</script>
</body>
