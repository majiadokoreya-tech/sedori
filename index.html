<style>

umeric:tabular-nums}.summary-card .hint{font-size:.68rem;color:var(--muted);font-weight:800;margin-top:7px}.summary-card .pill{position:absolute;right:10px;top:10px;background:#fff0f4;color:var(--accent);border-radius:999px;padding:3px 8px;font-size:.65rem;font-weight:1000}.green{color:var(--green)}.orange{color:var(--orange)}.blue{color:var(--blue)}.purple{color:var(--purple)}.red{color:var(--red)}.muted{color:var(--muted)}.mode-toggle{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#eceef5;border:1px solid var(--border);border-radius:18px;padding:5px;margin-bottom:12px}.mode-toggle.two{grid-template-columns:repeat(2,1fr)}.mode-toggle button{border:0;border-radius:14px;background:transparent;color:var(--muted);font-weight:1000;padding:10px 6px}.mode-toggle button.active{background:var(--accent);color:white;box-shadow:0 4px 12px rgba(255,65,104,.25)}.btn{border:0;border-radius:14px;padding:11px 13px;font-weight:1000;background:#f0f2f8;color:var(--text)}.btn-sm{font-size:.72rem;padding:7px 9px;border-radius:999px}.btn-primary{background:var(--accent);color:#fff}.btn-green{background:var(--green);color:#fff}.btn-blue{background:var(--blue);color:#fff}.btn-danger{background:var(--red);color:#fff}.btn-ghost{background:#f3f4f9;color:var(--text)}.quick-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;margin:8px 0}.quick-row .btn{white-space:nowrap}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.form-row.triple{grid-template-columns:1fr 1fr 1fr}.form-row.single{grid-template-columns:1fr}label{display:block;font-size:.72rem;color:var(--muted);font-weight:900;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid var(--border);border-radius:14px;background:#fafbff;padding:11px;color:var(--text);outline:none}textarea{min-height:78px;resize:vertical}.filter-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.filter-bar .wide{grid-column:1/3}.item-list{display:flex;flex-direction:column;gap:9px}.item{background:#fff;border:1px solid var(--border);border-radius:16px;padding:12px;box-shadow:0 4px 14px rgba(20,25,45,.06)}.item-top{display:flex;justify-content:space-between;gap:8px}.item-name{font-weight:1000;line-height:1.35}.item-profit{font-weight:1000;font-variant-numeric:tabular-nums;white-space:nowrap}.badge{display:inline-block;font-size:.68rem;font-weight:1000;border-radius:999px;padding:4px 8px;background:#f1f2f7;color:var(--muted);margin:4px 4px 0 0}.badge.sold{background:#e7fff5;color:var(--green)}.badge.unsold{background:#fff5df;color:#ad7200}.badge.shipped{background:#eaf1ff;color:var(--blue)}.badge.alert{background:#fff0f2;color:var(--red)}.item-meta{font-size:.78rem;color:var(--muted);line-height:1.65;margin-top:6px}.item-actions{display:flex;gap:7px;margin-top:10px}.item-actions button{flex:1}.calc-box{background:#f8f9fd;border:1px solid var(--border);border-radius:14px;padding:10px;margin:8px 0;display:grid;grid-template-columns:1fr 1fr;gap:7px}.calc-row{display:flex;justify-content:space-between;gap:8px;font-size:.78rem}.calc-row b{font-variant-numeric:tabular-nums}.bar-wrap{display:flex;flex-direction:column;gap:9px}.bar-line{display:grid;grid-template-columns:76px 1fr 96px;gap:8px;align-items:center;font-size:.78rem}.bar-bg{height:12px;background:#eef0f6;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--accent);border-radius:999px}.table{width:100%;border-collapse:collapse;font-size:.78rem}.table th,.table td{border-bottom:1px solid var(--border);padding:8px 4px;text-align:right}.table th:first-child,.table td:first-child{text-align:left}.table th{color:var(--muted);font-size:.7rem}.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.month-nav b{font-size:1rem}.empty{text-align:center;color:var(--muted);padding:22px 8px;font-weight:900}.mini-note{font-size:.73rem;color:var(--muted);line-height:1.55;margin-top:7px}.progress{height:10px;background:#eceef5;border-radius:999px;overflow:hidden;margin-top:8px}.progress div{height:100%;background:var(--green);border-radius:999px}.toast{position:fixed;left:50%;bottom:98px;transform:translateX(-50%);background:#1f2230;color:#fff;border-radius:999px;padding:10px 16px;font-weight:1000;font-size:.82rem;z-index:60;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1}.modal{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:50;display:none;align-items:flex-end}.modal.open{display:flex}.modal-inner{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modal-head h3{font-size:1.04rem;font-weight:1000}.close{border:0;background:#f1f2f7;border-radius:50%;width:38px;height:38px;font-weight:1000}.danger-zone{border:1px dashed #ffb5bf;background:#fff7f8}.fixed-add{position:fixed;right:14px;bottom:20px;z-index:32;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:15px 17px;font-weight:1000;box-shadow:0 10px 24px rgba(255,65,104,.35)}.detail-total{background:#f7f8fd;border:1px solid var(--border);border-radius:16px;padding:12px;margin-bottom:12px}.detail-total .big{font-size:1.5rem;font-weight:1000;margin-top:4px}.ship-note{background:#fff8e8;border:1px solid #ffe0a3;border-radius:14px;padding:10px;color:#8a6200;font-size:.76rem;line-height:1.55;margin-bottom:10px}.row-between{display:flex;justify-content:space-between;gap:10px;align-items:center}.small-link{border:0;background:transparent;color:var(--blue);font-weight:1000;font-size:.76rem}.save-state{font-size:.7rem;color:var(--muted);font-weight:900;text-align:right;line-height:1.35}
@media(max-width:370px){.grid2{gap:8px}.summary-card{padding:10px;min-height:82px}.summary-card .value{font-size:1.08rem}.form-row.triple{grid-template-columns:1fr}.tabs{top:56px}}
@media(min-width:760px){body{max-width:760px;margin:0 auto}.modal{align-items:center}.modal-inner{max-width:720px;margin:auto;border-radius:24px}.fixed-add{left:calc(50% + 290px);right:auto}}
</style>
</head>
<body>
<header><h1>せどり<span>管理</span></h1><div class="save-state"><div id="todayMini"></div><div id="saveState">保存済み</div></div></header>
<nav class="tabs"><button class="tab active" onclick="showPage('home',this)">ホーム</button><button class="tab" onclick="showPage('stock',this)">在庫</button><button class="tab" onclick="showPage('analysis',this)">分析</button><button class="tab" onclick="showPage('data',this)">データ</button></nav>
<main>
<section id="home" class="page active">
  <div class="mode-toggle"><button class="active" onclick="setMode('all',this)">全体</button><button onclick="setMode('sedori',this)">せどり</button><button onclick="setMode('fuyohin',this)">不用品</button></div>
  <div class="card"><div class="section-title">今の状況 <span class="mini-note">タップで内訳</span></div><div class="grid2" id="homeSummary"></div></div>
  <div class="card"><div class="section-title">今月の目標</div><div class="form-row"><div><label>目標利益 ¥</label><input id="goalInput" type="number" inputmode="numeric" placeholder="例：30000"></div><div style="display:flex;align-items:end"><button class="btn btn-primary" style="width:100%" onclick="saveGoal()">設定</button></div></div><div id="goalView"></div></div>
  <div class="card"><div class="section-title">累計 <span class="mini-note">タップで内訳</span></div><div class="grid2" id="lifetimeSummary"></div></div>
  <div class="card"><div class="section-title">最近売れた商品 <button class="btn btn-sm btn-ghost" onclick="showPage('analysis')">もっと見る</button></div><div id="recentSold"></div></div>
</section>
<section id="stock" class="page">
  <div class="mode-toggle two" id="stockModeToggle"><button class="active" onclick="setStockMode('sedori',this)">せどり</button><button onclick="setStockMode('fuyohin',this)">不用品</button></div>
  <button class="btn btn-primary" style="width:100%;margin-bottom:10px" onclick="openAddModal()">＋ 商品追加</button>
  <div class="filter-bar"><select id="filterStatus" onchange="renderStock()"><option value="all">全て</option><option value="unsold">未販売</option><option value="listed">出品中</option><option value="sold">売却済み</option><option value="shipped">発送済み</option></select><select id="filterCat" onchange="renderStock()"><option value="">全カテゴリ</option></select><input id="filterSearch" class="wide" placeholder="商品名・メモ検索" oninput="renderStock()"></div>
  <div class="grid2" id="stockSummary" style="margin-bottom:10px"></div><div id="stockList" class="item-list"></div>
</section>
<section id="analysis" class="page">
  <div class="mode-toggle two" id="analysisModeToggle"><button class="active" onclick="setAnalysisMode('sedori',this)">せどり</button><button onclick="setAnalysisMode('fuyohin',this)">不用品</button></div>
  <div class="card"><div class="month-nav"><button class="btn btn-sm btn-ghost" onclick="moveMonth(-1)">◀</button><b id="analysisMonth"></b><button class="btn btn-sm btn-ghost" onclick="moveMonth(1)">▶</button></div><div class="grid2" id="monthSummary"></div></div>
  <div class="card"><div class="section-title">月別 売上・利益</div><div id="monthlyBars" class="bar-wrap"></div></div>
  <div class="card"><div class="section-title">年別 売上・利益</div><div id="yearTable"></div></div>
  <div class="card"><div class="section-title">カテゴリ別 利益</div><div id="catBars" class="bar-wrap"></div></div>
  <div class="card"><div class="section-title">販売先別 売上</div><div id="platformBars" class="bar-wrap"></div></div>
  <div class="card"><div class="section-title">売れた履歴</div><div class="filter-bar"><select id="soldMonthFilter" class="wide" onchange="renderSoldHistory()"><option value="all">全期間</option></select></div><div id="soldHistory" class="item-list"></div></div>
</section>
<section id="data" class="page">
  <div class="card"><div class="section-title">送料設定・確認</div><button class="btn btn-blue" style="width:100%" onclick="openShipping()">送料表を開く</button><div class="mini-note">売れた記録では、販売先に合わせた発送方法だけ選べます。送料はあとから手入力で上書きできます。</div></div>
  <div class="card"><div class="section-title">バックアップ</div><button class="btn btn-blue" style="width:100%" onclick="downloadBackup()">バックアップを保存（JSON）</button><label style="margin-top:12px">バックアップから復元</label><input type="file" accept="application/json" onchange="restoreBackup(event)"><div class="mini-note">復元すると現在のデータは上書きされます。</div></div>
  <div class="card"><div class="section-title">CSV出力</div><div class="form-row"><div><label>開始月</label><input id="csvStart" type="month"></div><div><label>終了月</label><input id="csvEnd" type="month"></div></div><div class="mode-toggle two"><button class="active" id="csvSoldOnly" onclick="setCsvMode(true)">売れた商品のみ</button><button id="csvAll" onclick="setCsvMode(false)">全商品</button></div><button class="btn btn-primary" style="width:100%" onclick="downloadCSV()">CSVダウンロード</button><button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="copyCSV()">全件コピー</button><div id="csvPreview" class="mini-note"></div></div>
  <div class="card danger-zone"><div class="section-title">データ管理</div><div id="dataCount" class="mini-note"></div><button class="btn btn-danger" style="width:100%;margin-top:10px" onclick="deleteAll()">全データを削除</button></div>
</section>
</main>
<button class="fixed-add" onclick="openAddModal()">＋商品追加</button><div class="toast" id="toast"></div>

<div class="modal" id="soldModal"><div class="modal-inner"><div class="modal-head"><h3>売れた！</h3><button class="close" onclick="closeModal('soldModal')">×</button></div><input type="hidden" id="soldId"><div class="form-row"><div><label>販売先</label><select id="sPlatform" onchange="refreshShipOptions('s');calcSoldPreview()"><option value="mercari">メルカリ（10%）</option><option value="yahoo-flea">ヤフフリ（5%）</option><option value="yahoo-auction">ヤフオク（10%）</option><option value="other">その他（10%）</option></select></div><div><label>売れた日</label><input id="sDate" type="date"></div></div><div class="form-row"><div><label>売値 ¥</label><input id="sPrice" type="number" inputmode="numeric" oninput="calcSoldPreview()"></div><div><label>発送方法</label><select id="sShipMethod" onchange="applyShipMethod('s')"></select></div></div><div class="form-row"><div><label>送料 ¥</label><input id="sShip" type="number" inputmode="numeric" oninput="manualShip('s');calcSoldPreview()"></div><div><label>梱包費 ¥</label><input id="sMisc" type="number" inputmode="numeric" oninput="calcSoldPreview()"></div></div><div class="ship-note" id="soldShipNote"></div><div class="calc-box" id="soldPreview"></div><button class="btn btn-green" style="width:100%" onclick="saveSold()">記録する</button></div></div>

<div class="modal" id="editModal"><div class="modal-inner"><div class="modal-head"><h3>商品を編集</h3><button class="close" onclick="closeModal('editModal')">×</button></div><input type="hidden" id="eId"><div class="form-row single"><div><label>商品名</label><input id="eName"></div></div><div class="form-row"><div><label>カテゴリ</label><select id="eCat"></select></div><div><label>仕入れ先</label><select id="eSource"></select></div></div><div class="form-row"><div><label>仕入れ値 ¥</label><input id="eCost" type="number" inputmode="numeric" oninput="calcEditPreview()"></div><div><label>仕入れ日</label><input id="eDate" type="date"></div></div><div class="form-row"><div><label>ステータス</label><select id="eStatus" onchange="toggleEditSold()"><option value="unsold">未出品</option><option value="listed">出品中</option><option value="sold">売却済み・未発送</option><option value="shipped">発送済み</option></select></div><div><label>販売先</label><select id="ePlatform" onchange="refreshShipOptions('e');calcEditPreview()"><option value="mercari">メルカリ（10%）</option><option value="yahoo-flea">ヤフフリ（5%）</option><option value="yahoo-auction">ヤフオク（10%）</option><option value="other">その他（10%）</option></select></div></div><div id="editSoldArea"><div class="form-row"><div><label>売れた日</label><input id="eSoldDate" type="date"></div><div><label>実際の売値 ¥</label><input id="ePrice" type="number" inputmode="numeric" oninput="calcEditPreview()"></div></div><div class="form-row"><div><label>発送方法</label><select id="eShipMethod" onchange="applyShipMethod('e')"></select></div><div><label>送料 ¥</label><input id="eShip" type="number" inputmode="numeric" oninput="manualShip('e');calcEditPreview()"></div></div><div class="form-row single"><div><label>梱包費 ¥</label><input id="eMisc" type="number" inputmode="numeric" oninput="calcEditPreview()"></div></div><div class="ship-note" id="editShipNote"></div><div class="calc-box" id="editPreview"></div></div><div class="form-row single"><div><label>メモ</label><textarea id="eMemo"></textarea></div></div><button class="btn btn-primary" style="width:100%" onclick="saveEdit()">保存する</button></div></div>

<div class="modal" id="addModal"><div class="modal-inner"><div class="modal-head"><h3>商品追加</h3><button class="close" onclick="closeModal('addModal')">×</button></div><div class="mini-note" id="addModeNote"></div><div class="quick-row" id="quickSources"></div><div id="lastCarry" class="mini-note" style="display:none"></div><div class="form-row single"><div><label>商品名</label><input id="fName" placeholder="例：ラグマート 長袖"></div></div><div class="form-row"><div><label>仕入れ値 ¥</label><input id="fCost" type="number" inputmode="numeric"></div><div><label>仕入れ日</label><input id="fDate" type="date"></div></div><div class="form-row"><div><label>カテゴリ</label><select id="fCat"></select></div><div><label>仕入れ先</label><select id="fSource" onchange="highlightQuickSource()"></select></div></div><div class="form-row single"><div><label>メモ</label><textarea id="fMemo" placeholder="型番・状態・付属品など"></textarea></div></div><button class="btn btn-primary" style="width:100%" onclick="addItem()">商品を追加する</button><button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="openShipping()">送料を確認する</button></div></div>

<div class="modal" id="detailModal"><div class="modal-inner"><div class="modal-head"><h3 id="detailTitle">内訳</h3><button class="close" onclick="closeModal('detailModal')">×</button></div><div id="detailContent"></div></div></div>
<div class="modal" id="shipModal"><div class="modal-inner"><div class="modal-head"><h3>送料早見表</h3><button class="close" onclick="closeModal('shipModal')">×</button></div><div id="shipTable"></div><div class="mini-note">送料は改定されることがあります。発送前にアプリ側の最終表示も確認してください。送料欄は手入力で上書きできます。</div></div></div>

function groupBy(arr,keyFn){const m={};arr.forEach(i=>{const k=keyFn(i)||'未設定';(m[k]||(m[k]=[])).push(i)});return m}
function renderMonthlyBars(){const g=groupBy(soldItems(analysisMode),i=>(i.soldDate||'').slice(0,7));const rows=Object.keys(g).sort().reverse().slice(0,12).map(k=>({k,...summarize(g[k])}));const max=Math.max(1,...rows.map(r=>r.sales));$('monthlyBars').innerHTML=rows.length?rows.map(r=>barLine(r.k,r.sales,max,`${yen(r.sales)} / 利益 ${yen(r.profit)}`)).join(''):'<div class="empty">データなし</div>'}
function renderYearTable(){const g=groupBy(soldItems(analysisMode),i=>(i.soldDate||'').slice(0,4));const rows=Object.keys(g).sort().reverse().map(k=>({k,...summarize(g[k])}));$('yearTable').innerHTML=rows.length?`<table class="table"><tr><th>年</th><th>売上</th><th>利益</th><th>数</th><th>ROI</th></tr>${rows.map(r=>`<tr><td>${r.k}</td><td>${yen(r.sales)}</td><td>${yen(r.profit)}</td><td>${r.count}</td><td>${pct(r.roi)}</td></tr>`).join('')}</table>`:'<div class="empty">データなし</div>'}
function renderCatBars(){const g=groupBy(soldItems(analysisMode),i=>i.cat);const rows=Object.keys(g).map(k=>({k,...summarize(g[k])})).sort((a,b)=>b.profit-a.profit);const max=Math.max(1,...rows.map(r=>Math.max(0,r.profit)));$('catBars').innerHTML=rows.length?rows.map(r=>barLine(r.k,Math.max(0,r.profit),max,`${yen(r.profit)} / ${r.count}件`)).join(''):'<div class="empty">データなし</div>'}
function renderPlatformBars(){const g=groupBy(soldItems(analysisMode),i=>PLATFORM_NAME[i.platform]||'未設定');const rows=Object.keys(g).map(k=>({k,...summarize(g[k])})).sort((a,b)=>b.sales-a.sales);const max=Math.max(1,...rows.map(r=>r.sales));$('platformBars').innerHTML=rows.length?rows.map(r=>barLine(r.k,r.sales,max,`${yen(r.sales)} / 利益 ${yen(r.profit)}`)).join(''):'<div class="empty">データなし</div>'}
function barLine(label,value,max,right){return `<div class="bar-line"><div>${label}</div><div class="bar-bg"><div class="bar" style="width:${Math.max(3,Math.round(value/max*100))}%"></div></div><div style="text-align:right">${right}</div></div>`}
function renderSoldHistory(){const m=$('soldMonthFilter').value;let arr=soldItems(analysisMode).filter(i=>m==='all'||(i.soldDate||'').startsWith(m)).sort((a,b)=>(b.soldDate||'').localeCompare(a.soldDate||''));$('soldHistory').innerHTML=arr.length?arr.map(itemHtml).join(''):'<div class="empty">履歴なし</div>'}
function openDetail(key){const nowYm=ym(new Date()),target=ym(viewDate);let title='内訳',arr=[],summary=null;if(key.startsWith('analysisMonth')){arr=soldItems(analysisMode).filter(i=>(i.soldDate||'').startsWith(target));title=target+' の内訳'}else if(key.startsWith('month')){arr=soldItems(mode).filter(i=>(i.soldDate||'').startsWith(nowYm));title='今月の内訳'}else if(key.startsWith('life')){arr=soldItems(mode);title='累計の内訳'}else if(key.startsWith('inventory')||key==='avgCost'){arr=inventoryItems(mode);title='在庫の内訳'}summary=summarize(arr);let top=`<div class="detail-total"><div class="label">${title}</div><div class="big ${summary.profit>=0?'green':'red'}">利益 ${yen(summary.profit)}</div><div class="mini-note">件数 ${arr.length}件 / 売上 ${yen(summary.sales)} / 仕入れ ${yen(summary.cost)} / 手数料 ${yen(summary.fees)} / 送料 ${yen(summary.ship)} / 梱包 ${yen(summary.misc)} / ROI ${pct(summary.roi)}</div></div>`;$('detailTitle').textContent=title;$('detailContent').innerHTML=top+(arr.length?arr.sort((a,b)=>((b.soldDate||b.date||'').localeCompare(a.soldDate||a.date||''))).map(itemHtml).join(''):'<div class="empty">データなし</div>');$('detailModal').classList.add('open')}
function renderData(){$('dataCount').textContent=`全データ件数: ${items.length}件 / 売れた: ${soldItems('all').length}件 / 未販売: ${inventoryItems('all').length}件`;updateCsvPreview()}
function makeCSV(){const start=$('csvStart').value,end=$('csvEnd').value;let arr=csvSoldOnly?soldItems('all'):[...items];arr=arr.filter(i=>{const d=(['sold','shipped'].includes(i.status)?i.soldDate:i.date)||'';const m=d.slice(0,7);return(!start||m>=start)&&(!end||m<=end)});const head=['商品名','種別','カテゴリ','仕入れ先','仕入れ日','状態','売れた日','売上','仕入れ値','送料','発送方法','梱包費','手数料','利益','ROI','販売先','メモ'];const rows=arr.map(i=>[i.name,i.type==='fuyohin'?'不用品':'せどり',i.cat,i.source,i.date,statusText(i.status),i.soldDate,i.actualPrice||i.price||0,i.cost||0,i.ship||0,shipName(i.shipMethod),i.misc||0,fee(i.actualPrice||i.price||0,i.platform,i.feeRate),profitOf(i),roiOf(i),PLATFORM_NAME[i.platform]||'',i.memo||'']);return [head,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n')}
function setCsvMode(v){csvSoldOnly=v;$('csvSoldOnly').classList.toggle('active',v);$('csvAll').classList.toggle('active',!v);updateCsvPreview()}function updateCsvPreview(){if(!$('csvPreview'))return;const csv=makeCSV();$('csvPreview').textContent='プレビュー: '+csv.split('\n').slice(0,3).join(' / ')}
function downloadCSV(){downloadBlob(new Blob(['\ufeff'+makeCSV()],{type:'text/csv'}),`sedori_${today()}.csv`);toast('CSVを保存しました')}function copyCSV(){navigator.clipboard.writeText(makeCSV()).then(()=>toast('CSVをコピーしました')).catch(()=>toast('コピーできませんでした'))}
function downloadBackup(){const data={version:'2026-06-24',items,goal:localStorage.getItem('sedori_goal')||0,exportedAt:new Date().toISOString()};downloadBlob(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),`sedori_backup_${today()}.json`);toast('バックアップを保存しました')}
function restoreBackup(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);const next=Array.isArray(data)?data:data.items;if(!Array.isArray(next))throw new Error();if(!confirm('現在のデータを上書きして復元しますか？'))return;items=next;normalizeAll();if(data.goal!==undefined)localStorage.setItem('sedori_goal',data.goal);save();renderAll();toast('復元しました')}catch{toast('復元できませんでした')}};r.readAsText(file)}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function deleteAll(){if(!confirm('全データを削除しますか？'))return;if(!confirm('本当に削除します。バックアップは保存しましたか？'))return;items=[];save();renderAll();toast('全データを削除しました')}
function openShipping(){const groups={mercari:'メルカリ',yahoo:'Yahoo!フリマ/ヤフオク',all:'共通'};let html='<div class="ship-note">メルカリはネコポス210円、ゆうパケットポスト215円、宅急便コンパクト455円に修正。Yahoo系はヤフーフリマ/ヤフオク用の候補を分けました。</div>';['mercari','yahoo','all'].forEach(g=>{const rows=SHIPPING_METHODS.filter(x=>x.platform===g&&x.id!=='manual');if(!rows.length)return;html+=`<div class="section-title">${groups[g]}</div><table class="table"><tr><th>発送方法</th><th>送料</th><th>メモ</th></tr>${rows.map(r=>`<tr><td>${r.name}</td><td>${r.fee===''?'手入力':yen(r.fee)}</td><td>${r.note||''}</td></tr>`).join('')}</table>`});$('shipTable').innerHTML=html;$('shipModal').classList.add('open')}
init();
</script>
