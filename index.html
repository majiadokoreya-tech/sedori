<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>せどり管理</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=JetBrains+Mono:wght@400;600&display=swap');
:root{
  --bg:#f5f6fa;--surface:#ffffff;--card:#ffffff;--border:#e8e8f0;
  --accent:#ff4d6d;--accent2:#00b87a;--accent3:#f0a500;
  --blue:#4a90e2;--text:#1a1a2e;--muted:#9090b0;--radius:14px;
  --shadow:0 2px 12px rgba(0,0,0,.07);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'M PLUS Rounded 1c',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px;}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);}
header h1{font-size:1.1rem;font-weight:800;}header h1 span{color:var(--accent);}
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:49px;z-index:99;}
.tab{flex:1;padding:11px 4px;text-align:center;font-size:.73rem;font-weight:700;border:none;background:none;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.page{display:none;padding:14px;}.page.active{display:block;}
/* サマリー */
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.sum-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);}
.sum-card .label{font-size:.7rem;color:var(--muted);margin-bottom:3px;}
.sum-card .value{font-size:1.2rem;font-weight:800;font-family:'JetBrains Mono',monospace;}
.sum-card.profit .value{color:var(--accent2);}
.sum-card.revenue .value{color:var(--accent3);}
.sum-card.items .value{color:var(--blue);}
.sum-card.roi .value{color:var(--accent);}
/* トグル */
.mode-toggle{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:3px;margin-bottom:12px;gap:3px;}
.mode-btn{flex:1;padding:7px;border:none;border-radius:7px;font-family:inherit;font-size:.78rem;font-weight:700;cursor:pointer;transition:all .2s;background:transparent;color:var(--muted);}
.mode-btn.active{background:var(--accent);color:#fff;}
/* フォーム */
.form-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:14px;box-shadow:var(--shadow);}
.form-card h2{font-size:.8rem;font-weight:700;margin-bottom:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.form-row.single{grid-template-columns:1fr;}.form-row.triple{grid-template-columns:1fr 1fr 1fr;}
label{font-size:.7rem;color:var(--muted);display:block;margin-bottom:3px;}
input,select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:.88rem;padding:9px 10px;transition:border-color .2s;-webkit-appearance:none;}
input:focus,select:focus{outline:none;border-color:var(--accent);}
input[type=number]{font-family:'JetBrains Mono',monospace;}
/* 計算プレビュー */
.calc-preview{background:var(--bg);border:1px solid var(--accent);border-radius:10px;padding:10px 12px;margin:8px 0;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;}
.calc-row{display:flex;justify-content:space-between;align-items:center;}
.calc-row span:first-child{font-size:.72rem;color:var(--muted);}
.calc-row span:last-child{font-family:'JetBrains Mono',monospace;font-size:.82rem;font-weight:600;}
.calc-row.profit span:last-child{color:var(--accent2);font-size:.95rem;}
.calc-row.loss span:last-child{color:var(--accent);font-size:.95rem;}
.calc-row.roi span:last-child{color:var(--accent3);}
/* ボタン */
.btn{padding:11px 18px;border:none;border-radius:10px;font-family:inherit;font-weight:700;font-size:.88rem;cursor:pointer;transition:all .2s;}
.btn-primary{background:var(--accent);color:#fff;width:100%;margin-top:6px;}
.btn-primary:active{opacity:.85;transform:scale(.98);}
.btn-sm{padding:6px 11px;font-size:.72rem;border-radius:6px;}
.btn-ghost{background:var(--bg);color:var(--muted);border:1px solid var(--border);}
.btn-danger{background:rgba(255,77,109,.1);color:var(--accent);border:1px solid rgba(255,77,109,.3);}
/* フィルター */
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.filter-bar select,.filter-bar input{flex:1;min-width:90px;padding:8px 10px;font-size:.8rem;}
/* 在庫リスト */
.item-list{display:flex;flex-direction:column;gap:8px;}
.item-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;border-left:3px solid var(--accent3);box-shadow:var(--shadow);cursor:pointer;transition:box-shadow .2s;}
.item-card:active{box-shadow:none;}
.item-card.sold{border-left-color:var(--accent2);}
.item-header{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:6px;}
.item-name{font-weight:700;font-size:.9rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.badge{font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:20px;white-space:nowrap;}
.badge-sold{background:rgba(0,184,122,.12);color:var(--accent2);border:1px solid rgba(0,184,122,.3);}
.badge-unsold{background:rgba(240,165,0,.12);color:var(--accent3);border:1px solid rgba(240,165,0,.3);}
.item-nums{display:flex;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
.item-num{font-size:.72rem;color:var(--muted);}
.item-num span{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--text);font-size:.82rem;}
.item-num span.green{color:var(--accent2);}
.item-num span.red{color:var(--accent);}
.item-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
.meta-tag{font-size:.67rem;color:var(--muted);background:var(--bg);border-radius:4px;padding:2px 6px;}
.item-actions{display:flex;gap:6px;}
/* 詳細展開 */
.item-detail{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.item-detail.open{display:block;}
/* グラフ */
.chart-section{margin-bottom:18px;}
.chart-section h2{font-size:.8rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}
.chart-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);}
canvas{width:100%!important;}
.cat-bar-wrap{display:flex;flex-direction:column;gap:10px;}
.cat-bar-header{display:flex;justify-content:space-between;font-size:.8rem;margin-bottom:3px;}
.cat-bar-header span:last-child{font-family:'JetBrains Mono',monospace;color:var(--accent2);font-weight:600;}
.bar-track{background:var(--bg);border-radius:99px;height:7px;overflow:hidden;}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent2),#00d68f);}
/* 月選択 */
.month-selector{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:12px;box-shadow:var(--shadow);}
.month-selector button{background:none;border:none;color:var(--muted);font-size:1.1rem;cursor:pointer;}
.month-selector span{flex:1;text-align:center;font-weight:700;font-size:.88rem;}
/* せどり・不用品カード */
.split-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.split-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);cursor:pointer;transition:all .2s;}
.split-card.active-card{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.12);}
.split-card.sedori{border-left:3px solid var(--accent2);}
.split-card.fuyohin{border-left:3px solid var(--blue);}
.split-card .sc-title{font-size:.68rem;font-weight:700;margin-bottom:6px;}
.split-card.sedori .sc-title{color:var(--accent2);}
.split-card.fuyohin .sc-title{color:var(--blue);}
.split-card .sc-profit{font-family:'JetBrains Mono',monospace;font-size:1.05rem;font-weight:800;}
.split-card.sedori .sc-profit{color:var(--accent2);}
.split-card.fuyohin .sc-profit{color:var(--blue);}
.split-card .sc-sub{font-size:.68rem;color:var(--muted);margin-top:4px;}
/* 売れた履歴 */
.sold-section{margin-top:18px;}
.sold-section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;cursor:pointer;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);}
.sold-section-header h2{font-size:.8rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin:0;}
.sold-list{display:flex;flex-direction:column;gap:8px;}
/* 今月の調子 */
.kondition-bar{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;}
.kondition-emoji{font-size:1.8rem;}
.kondition-text .k-title{font-size:.82rem;font-weight:800;color:var(--text);}
.kondition-text .k-sub{font-size:.72rem;color:var(--muted);margin-top:2px;}
/* 在庫総額バー */
.stock-bar{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;}
.stock-bar .sb-label{font-size:.72rem;color:var(--muted);}
.stock-bar .sb-value{font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:800;color:var(--blue);}
/* モーダル */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:20px 20px 0 0;padding:18px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;border:1px solid var(--border);}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.modal-header h3{font-size:.98rem;font-weight:800;}
.modal-close{background:none;border:none;color:var(--muted);font-size:1.3rem;cursor:pointer;}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--accent2);color:#fff;font-weight:700;padding:10px 20px;border-radius:99px;font-size:.82rem;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
.empty{text-align:center;padding:32px 16px;color:var(--muted);font-size:.88rem;}
.empty .icon{font-size:2.2rem;margin-bottom:8px;}
@media(max-width:360px){.summary-grid{grid-template-columns:1fr;}.split-cards{grid-template-columns:1fr;}}
</style>
</head>
<body>
<header>
  <h1>せどり<span>管理</span></h1>
  <div style="font-size:.72rem;color:var(--muted);" id="headerDate"></div>
</header>
<div class="tabs">
  <button class="tab active" onclick="showPage('add')">➕ 登録</button>
  <button class="tab" onclick="showPage('list')">📦 在庫</button>
  <button class="tab" onclick="showPage('stats')">📊 分析</button>
  <button class="tab" onclick="showPage('data')">💾 データ</button>
</div>

<!-- 登録 -->
<div class="page active" id="page-add">
  <div class="mode-toggle">
    <button class="mode-btn active" id="toggle-all" onclick="setSummaryMode('all')">全体</button>
    <button class="mode-btn" id="toggle-sedori" onclick="setSummaryMode('sedori')">せどり</button>
    <button class="mode-btn" id="toggle-fuyohin" onclick="setSummaryMode('fuyohin')">不用品</button>
  </div>

  <!-- 今月の調子 -->
  <div class="kondition-bar" id="kondition-bar">
    <div class="kondition-emoji" id="kondition-emoji">😐</div>
    <div class="kondition-text">
      <div class="k-title" id="kondition-title">目標を設定してください</div>
      <div class="k-sub" id="kondition-sub">登録 → 目標設定から</div>
    </div>
    <div style="text-align:right;">
      <div style="font-size:.68rem;color:var(--muted);">今月利益</div>
      <div style="font-family:'JetBrains Mono',monospace;font-weight:800;font-size:.95rem;" id="kondition-profit">¥0</div>
    </div>
  </div>

  <div class="summary-grid">
    <div class="sum-card profit"><div class="label" id="s-label-profit">今月利益</div><div class="value" id="s-profit">¥0</div></div>
    <div class="sum-card revenue"><div class="label" id="s-label-revenue">今月売上</div><div class="value" id="s-revenue">¥0</div></div>
    <div class="sum-card items"><div class="label">在庫数</div><div class="value" id="s-unsold">0件</div></div>
    <div class="sum-card roi"><div class="label" id="s-label-roi">今月ROI</div><div class="value" id="s-roi">0%</div></div>
  </div>

  <!-- 在庫総額 -->
  <div class="stock-bar">
    <div>
      <div class="sb-label">在庫仕入れ総額</div>
      <div class="sb-value" id="stock-total">¥0</div>
    </div>
    <div style="text-align:right;">
      <div class="sb-label">平均仕入れ値</div>
      <div class="sb-value" id="stock-avg">¥0</div>
    </div>
  </div>

  <div class="form-card">
    <h2>仕入れ登録</h2>
    <div style="margin-bottom:12px;">
      <label style="margin-bottom:6px;display:block;">よく使う仕入れ先</label>
      <div style="display:flex;flex-wrap:wrap;gap:6px;">
        <button class="quick-src-btn" onclick="setQuickSource('不用品')" style="padding:7px 12px;border:1px solid var(--border);border-radius:20px;background:var(--bg);color:var(--text);font-family:inherit;font-size:.78rem;font-weight:700;cursor:pointer;transition:all .2s;">🏠 不用品</button>
        <button class="quick-src-btn" onclick="setQuickSource('ハードオフ')" style="padding:7px 12px;border:1px solid var(--border);border-radius:20px;background:var(--bg);color:var(--text);font-family:inherit;font-size:.78rem;font-weight:700;cursor:pointer;transition:all .2s;">🎮 ハードオフ</button>
        <button class="quick-src-btn" onclick="setQuickSource('ブックオフ')" style="padding:7px 12px;border:1px solid var(--border);border-radius:20px;background:var(--bg);color:var(--text);font-family:inherit;font-size:.78rem;font-weight:700;cursor:pointer;transition:all .2s;">📚 ブックオフ</button>
        <button class="quick-src-btn" onclick="setQuickSource('メルカリ')" style="padding:7px 12px;border:1px solid var(--border);border-radius:20px;background:var(--bg);color:var(--text);font-family:inherit;font-size:.78rem;font-weight:700;cursor:pointer;transition:all .2s;">🛒 メルカリ</button>
        <button class="quick-src-btn" onclick="setQuickSource('フリマ')" style="padding:7px 12px;border:1px solid var(--border);border-radius:20px;background:var(--bg);color:var(--text);font-family:inherit;font-size:.78rem;font-weight:700;cursor:pointer;transition:all .2s;">🏪 フリマ</button>
      </div>
    </div>
    <div id="last-carry-bar" style="display:none;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:10px;flex-direction:row;justify-content:space-between;align-items:center;">
      <span style="font-size:.75rem;color:var(--muted);">前回: <span id="last-carry-label" style="color:var(--text);font-weight:700;"></span></span>
      <button onclick="applyLastCarry()" style="padding:4px 10px;border:none;border-radius:6px;background:var(--accent);color:#fff;font-family:inherit;font-size:.72rem;font-weight:700;cursor:pointer;">引き継ぐ</button>
    </div>
    <div class="form-row single"><div><label>商品名</label><input type="text" id="f-name" placeholder="例：ポケモンカード 旧裏 リザードン"/></div></div>
    <div class="form-row">
      <div><label>仕入れ値 ¥</label><input type="number" id="f-cost" placeholder="0" min="0"/></div>
      <div><label>仕入れ日</label><input type="date" id="f-date"/></div>
    </div>
    <div class="form-row">
      <div><label>カテゴリ</label>
        <select id="f-cat"><option>レトロゲーム</option><option>トレカ</option><option>ブランド品</option><option>古着</option><option>電子機器</option><option>本・漫画</option><option>おもちゃ</option><option>その他</option></select>
      </div>
      <div><label>仕入れ先</label>
        <select id="f-source"><option>不用品</option><option>ハードオフ</option><option>ブックオフ</option><option>メルカリ</option><option>ヤフオク</option><option>リサイクルショップ</option><option>フリマ</option><option>その他</option></select>
      </div>
    </div>
    <div class="form-row single"><div><label>メモ</label><input type="text" id="f-memo" placeholder="コンディション、保管場所など"/></div></div>
    <button class="btn btn-primary" onclick="addItem()">仕入れ登録する</button>
    <button class="btn btn-ghost" onclick="openShippingModal()" style="width:100%;margin-top:8px;text-align:center;">📦 送料を確認する</button>
    <!-- 目標設定 -->
    <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);">
      <label>今月の目標利益 ¥</label>
      <div style="display:flex;gap:8px;margin-top:4px;">
        <input type="number" id="f-goal" placeholder="例：30000" min="0" style="flex:1;"/>
        <button onclick="saveGoal()" style="padding:9px 14px;border:none;border-radius:8px;background:var(--blue);color:#fff;font-family:inherit;font-size:.82rem;font-weight:700;cursor:pointer;">設定</button>
      </div>
    </div>
  </div>
</div>

<!-- 在庫 -->
<div class="page" id="page-list">
  <div class="filter-bar">
    <select id="filter-status" onchange="renderList()"><option value="unsold">未販売</option><option value="">全て</option><option value="sold">売れた</option></select>
    <select id="filter-cat" onchange="renderList()"><option value="">全カテゴリ</option></select>
    <input type="text" id="filter-search" placeholder="🔍 検索" oninput="renderList()" style="flex:2;"/>
  </div>
  <div class="item-list" id="itemList"><div class="empty"><div class="icon">📦</div>まだ商品がありません</div></div>
</div>

<!-- 分析 -->
<div class="page" id="page-stats">
  <div class="month-selector">
    <button onclick="changeStatsMonth(-1)">◀</button>
    <span id="statsMonthLabel"></span>
    <button onclick="changeStatsMonth(1)">▶</button>
  </div>
  <div style="font-size:.7rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">📊 全体</div>
  <div class="summary-grid" style="margin-bottom:12px;">
    <div class="sum-card profit"><div class="label">利益</div><div class="value" id="st-profit">¥0</div></div>
    <div class="sum-card revenue"><div class="label">売上</div><div class="value" id="st-revenue">¥0</div></div>
    <div class="sum-card items"><div class="label">販売数</div><div class="value" id="st-count">0件</div></div>
    <div class="sum-card roi"><div class="label">ROI</div><div class="value" id="st-roi">0%</div></div>
  </div>
  <!-- せどり・不用品カード（タップで履歴切り替え） -->
  <div class="split-cards">
    <div class="split-card sedori active-card" id="sc-sedori" onclick="setSoldFilter('sedori')">
      <div class="sc-title">📦 せどり <span id="sc-sedori-arrow" style="float:right;">▼</span></div>
      <div class="sc-profit" id="st-sedori-profit">¥0</div>
      <div class="sc-sub">売上 <span id="st-sedori-revenue" style="color:var(--accent3);font-family:'JetBrains Mono',monospace;">¥0</span></div>
      <div class="sc-sub"><span id="st-sedori-count">0件</span> / ROI <span id="st-sedori-roi">0%</span></div>
    </div>
    <div class="split-card fuyohin" id="sc-fuyohin" onclick="setSoldFilter('fuyohin')">
      <div class="sc-title">🏠 不用品 <span id="sc-fuyohin-arrow" style="float:right;"></span></div>
      <div class="sc-profit" id="st-fuyohin-profit">¥0</div>
      <div class="sc-sub">売上 <span id="st-fuyohin-revenue" style="color:var(--accent3);font-family:'JetBrains Mono',monospace;">¥0</span></div>
      <div class="sc-sub"><span id="st-fuyohin-count">0件</span></div>
    </div>
  </div>
  <div class="chart-section"><h2>月別 利益推移 <span style="font-size:.68rem;font-weight:400;">（タップで詳細）</span></h2><div class="chart-wrap"><canvas id="monthChart" height="150" onclick="onMonthChartClick(event)" style="cursor:pointer;"></canvas></div></div>
  <div class="chart-section"><h2>せどり / 不用品 比較</h2><div class="chart-wrap"><canvas id="splitChart" height="130"></canvas></div></div>
  <div class="chart-section"><h2>カテゴリ別 利益</h2><div class="chart-wrap"><div class="cat-bar-wrap" id="catBars"><div class="empty" style="padding:16px;"><div class="icon">📊</div>データなし</div></div></div></div>
  <!-- 売れた履
