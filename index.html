<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>せどり管理</title>
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--text:#202124;--muted:#70757a;--line:#e4e6ea;
  --accent:#ff3f68;--green:#078a61;--blue:#2f6fdf;--orange:#d87800;--red:#d93025;
  --shadow:0 4px 16px rgba(30,35,45,.07);--radius:16px
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:82px}
button,input,select,textarea{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
header{
  position:sticky;top:0;z-index:20;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);
  padding:13px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center
}
h1{margin:0;font-size:1.15rem;font-weight:900}
h1 span{color:var(--accent)}
.save-state{font-size:.72rem;color:var(--muted);font-weight:700}
nav{
  position:sticky;top:54px;z-index:19;background:#fff;border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:repeat(3,1fr)
}
.tab{border:0;background:#fff;padding:12px 4px;color:var(--muted);font-size:.82rem;font-weight:850;border-bottom:3px solid transparent}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.page{display:none;padding:12px;max-width:760px;margin:auto}
.page.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:11px}
.section-title{font-size:.9rem;font-weight:900}
.note{font-size:.72rem;color:var(--muted);line-height:1.5}
.segment{
  display:grid;background:#e9ebef;border-radius:14px;padding:4px;gap:4px;margin-bottom:10px
}
.segment.two{grid-template-columns:repeat(2,1fr)}
.segment.three{grid-template-columns:repeat(3,1fr)}
.segment button{border:0;background:transparent;color:var(--muted);border-radius:11px;padding:10px 4px;font-size:.78rem;font-weight:900}
.segment button.active{background:#fff;color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.summary-card{
  border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:left;min-height:82px
}
.summary-card .label{font-size:.72rem;color:var(--muted);font-weight:800}
.summary-card .value{font-size:1.23rem;font-weight:950;margin-top:5px;font-variant-numeric:tabular-nums}
.summary-card .sub{font-size:.68rem;color:var(--muted);margin-top:5px}
.green{color:var(--green)}.blue{color:var(--blue)}.orange{color:var(--orange)}.red{color:var(--red)}
.btn{border:0;border-radius:12px;padding:11px 13px;font-weight:900;background:#eef0f4;color:var(--text)}
.btn-primary{background:var(--accent);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.btn-small{padding:8px 10px;font-size:.76rem}
.full{width:100%}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:10px}
input,select,textarea{
  width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);
  padding:11px;outline:none
}
textarea{min-height:76px;resize:vertical}
label{display:block;font-size:.72rem;color:var(--muted);font-weight:800;margin-bottom:5px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-grid.one{grid-template-columns:1fr}
.item-list{display:flex;flex-direction:column;gap:9px}
.item{
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 3px 12px rgba(30,35,45,.05)
}
.item-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item-name{font-weight:900;line-height:1.35}
.item-price{font-weight:950;white-space:nowrap;font-variant-numeric:tabular-nums}
.badges{margin-top:5px}
.badge{display:inline-block;border-radius:999px;padding:4px 8px;background:#f0f1f4;color:var(--muted);font-size:.67rem;font-weight:850;margin:0 4px 4px 0}
.badge.selling{background:#edf3ff;color:var(--blue)}
.badge.wait{background:#fff3dd;color:var(--orange)}
.badge.done{background:#e9f8f2;color:var(--green)}
.item-meta{font-size:.76rem;color:var(--muted);line-height:1.6;margin-top:5px}
.item-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.empty{text-align:center;color:var(--muted);font-weight:800;padding:28px 8px}
.month-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.month-nav button{border:0;background:#eef0f4;border-radius:10px;padding:8px 12px;font-weight:900}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:.76rem}
th,td{border-bottom:1px solid var(--line);padding:9px 5px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-size:.69rem}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none;align-items:flex-end}
.modal.open{display:flex}
.modal-box{background:#fff;width:100%;max-height:93vh;overflow:auto;border-radius:22px 22px 0 0;padding:17px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal-head h2{margin:0;font-size:1.02rem}
.close{border:0;background:#eef0f4;border-radius:50%;width:38px;height:38px;font-weight:900}
.preview{background:#f7f8fa;border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0}
.preview-row{display:flex;justify-content:space-between;gap:8px;font-size:.77rem;padding:3px 0}
.danger-zone{border:1px dashed #ef9c96;background:#fff8f7}
.fixed-add{
  position:fixed;right:15px;bottom:18px;z-index:25;border:0;border-radius:999px;background:var(--accent);
  color:#fff;padding:14px 18px;font-weight:950;box-shadow:0 8px 22px rgba(255,63,104,.32)
}
.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:80;background:#24262b;color:#fff;
  padding:10px 16px;border-radius:999px;font-size:.8rem;font-weight:850;opacity:0;pointer-events:none;transition:.2s
}
.toast.show{opacity:1}
.detail-summary{background:#f7f8fa;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.detail-summary .big{font-size:1.35rem;font-weight:950;margin-top:4px}
.filter-box{display:none;margin-bottom:10px}.filter-box.open{display:block}
@media(min-width:760px){
  .modal{align-items:center}.modal-box{max-width:720px;margin:auto;border-radius:22px}
  .fixed-add{left:calc(50% + 292px);right:auto}
}
@media(max-width:370px){.summary-card .value{font-size:1.08rem}.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>せどり<span>管理</span></h1>
  <div class="save-state" id="saveState">保存済み</div>
</header>

<nav>
  <button class="tab active" data-page="stock" onclick="showPage('stock',this)">在庫</button>
  <button class="tab" data-page="analysis" onclick="showPage('analysis',this)">分析</button>
  <button class="tab" data-page="data" onclick="showPage('data',this)">データ</button>
</nav>

<main>
<section id="stock" class="page active">
  <div class="segment two" id="stockTypeTabs">
    <button class="active" onclick="setStockType('sedori',this)">せどり</button>
    <button onclick="setStockType('fuyohin',this)">不用品</button>
  </div>

  <div class="segment three" id="stockStatusTabs">
    <button class="active" onclick="setStockStatus('selling',this)">販売中</button>
    <button onclick="setStockStatus('waiting',this)">未発送</button>
    <button onclick="setStockStatus('history',this)">販売履歴</button>
  </div>

  <div class="toolbar">
    <input id="searchInput" placeholder="商品名を検索" oninput="renderStock()">
    <button class="btn btn-small" onclick="toggleFilter()">絞り込み</button>
  </div>

  <div id="filterBox" class="card filter-box">
    <div class="form-grid">
      <div><label>カテゴリ</label><select id="stockCat" onchange="renderStock()"></select></div>
      <div><label>並び順</label>
        <select id="stockSort" onchange="renderStock()">
          <option value="new">新しい順</option>
          <option value="old">古い順</option>
          <option value="profit">利益が高い順</option>
          <option value="price">販売価格が高い順</option>
        </select>
      </div>
    </div>
    <button class="btn full" onclick="resetFilter()">絞り込みをリセット</button>
  </div>

  <div id="stockCount" class="note" style="margin:2px 2px 9px"></div>
  <div id="stockList" class="item-list"></div>
</section>

<section id="analysis" class="page">
  <div class="segment three" id="analysisTypeTabs">
    <button class="active" onclick="setAnalysisType('all',this)">全体</button>
    <button onclick="setAnalysisType('sedori',this)">せどり</button>
    <button onclick="setAnalysisType('fuyohin',this)">不用品</button>
  </div>

  <div class="card">
    <div class="month-nav">
      <button onclick="moveMonth(-1)">‹</button>
      <b id="analysisMonth"></b>
      <button onclick="moveMonth(1)">›</button>
    </div>
    <div class="summary" id="analysisSummary"></div>
  </div>

  <div class="card">
    <div class="section-head"><div class="section-title">累計</div><div class="note">カードを押すと詳細表示</div></div>
    <div class="summary" id="totalSummary"></div>
  </div>

  <div class="card">
    <div class="section-title" style="margin-bottom:10px">月別実績</div>
    <div class="table-wrap" id="monthlyTable"></div>
  </div>

  <div class="card">
    <div class="section-title" style="margin-bottom:10px">販売先別</div>
    <div class="table-wrap" id="platformTable"></div>
  </div>
</section>

<section id="data" class="page">
  <div class="card">
    <div class="section-head"><div class="section-title">データ管理</div><div id="dataCount" class="note"></div></div>
    <button class="btn btn-blue full" onclick="downloadBackup()">バックアップを保存</button>
    <label class="btn full" style="display:block;text-align:center;margin-top:8px">
      バックアップを復元
      <input type="file" accept=".json" onchange="restoreBackup(event)" style="display:none">
    </label>
  </div>

  <div class="card">
    <div class="section-title" style="margin-bottom:10px">CSV</div>
    <div class="form-grid">
      <div><label>開始月</label><input id="csvStart" type="month"></div>
      <div><label>終了月</label><input id="csvEnd" type="month"></div>
    </div>
    <button class="btn btn-green full" onclick="downloadCSV()">CSVを保存</button>
  </div>

  <div class="card">
    <div class="section-head"><div class="section-title">送料早見表</div><button class="btn btn-small" onclick="openShipping()">開く</button></div>
    <div class="note">送料は売れた登録時に発送方法から自動入力され、手入力で修正できます。</div>
  </div>

  <div class="card danger-zone">
    <div class="section-title" style="margin-bottom:10px">全データ削除</div>
    <button class="btn btn-danger full" onclick="deleteAll()">全データを削除</button>
  </div>
</section>
</main>

<button class="fixed-add" id="addButton" onclick="openAdd()">＋ 商品追加</button>
<div class="toast" id="toast"></div>

<!-- 商品追加 -->
<div class="modal" id="addModal">
  <div class="modal-box">
    <div class="modal-head"><h2>商品を追加</h2><button class="close" onclick="closeModal('addModal')">×</button></div>
    <div class="form-grid">
      <div><label>種別</label><select id="aType"><option value="sedori">せどり</option><option value="fuyohin">不用品</option></select></div>
      <div><label>登録日</label><input id="aDate" type="date"></div>
    </div>
    <div class="form-grid one"><div><label>商品名</label><input id="aName" placeholder="例：ワンピース"></div></div>
    <div class="form-grid">
      <div><label>カテゴリ</label><select id="aCat"></select></div>
      <div><label>仕入れ先</label><select id="aSource"></select></div>
    </div>
    <div class="form-grid one"><div><label>仕入れ値</label><input id="aCost" type="number" inputmode="numeric" min="0" placeholder="0"></div></div>
    <div class="form-grid one"><div><label>メモ</label><textarea id="aMemo"></textarea></div></div>
    <div class="note" style="margin-bottom:10px">登録すると自動で「販売中」になります。</div>
    <button class="btn btn-primary full" onclick="addItem()">登録する</button>
  </div>
</div>

<!-- 売れた -->
<div class="modal" id="soldModal">
  <div class="modal-box">
    <div class="modal-head"><h2>売れた記録</h2><button class="close" onclick="closeModal('soldModal')">×</button></div>
    <input id="soldId" type="hidden">
    <div id="soldName" class="section-title" style="margin-bottom:12px"></div>
    <div class="form-grid">
      <div><label>売れた日</label><input id="sDate" type="date"></div>
      <div><label>販売先</label>
        <select id="sPlatform" onchange="refreshShipOptions('s');calcSoldPreview()">
          <option value="mercari">メルカリ</option>
          <option value="yahoo-flea">Yahoo!フリマ</option>
          <option value="yahoo-auction">ヤフオク</option>
          <option value="other">その他</option>
        </select>
      </div>
    </div>
    <div class="form-grid one"><div><label>販売価格</label><input id="sPrice" type="number" inputmode="numeric" oninput="calcSoldPreview()"></div></div>
    <div class="form-grid">
      <div><label>発送方法</label><select id="sShipMethod" onchange="applyShipFee('s');calcSoldPreview()"></select></div>
      <div><label>送料</label><input id="sShip" type="number" inputmode="numeric" oninput="calcSoldPreview()"></div>
    </div>
    <div class="form-grid one"><div><label>梱包費・その他</label><input id="sMisc" type="number" inputmode="numeric" value="0" oninput="calcSoldPreview()"></div></div>
    <div class="preview" id="soldPreview"></div>
    <button class="btn btn-green full" onclick="saveSold()">売れた記録を保存</button>
  </div>
</div>

<!-- 編集 -->
<div class="modal" id="editModal">
  <div class="modal-box">
    <div class="modal-head"><h2>商品を編集</h2><button class="close" onclick="closeModal('editModal')">×</button></div>
    <input id="eId" type="hidden">
    <div class="form-grid">
      <div><label>種別</label><select id="eType"><option value="sedori">せどり</option><option value="fuyohin">不用品</option></select></div>
      <div><label>登録日</label><input id="eDate" type="date"></div>
    </div>
    <div class="form-grid one"><div><label>商品名</label><input id="eName"></div></div>
    <div class="form-grid">
      <div><label>カテゴリ</label><select id="eCat"></select></div>
      <div><label>仕入れ先</label><select id="eSource"></select></div>
    </div>
    <div class="form-grid">
      <div><label>仕入れ値</label><input id="eCost" type="number" inputmode="numeric"></div>
      <div><label>状態</label>
        <select id="eStatus" onchange="toggleEditSale()">
          <option value="listed">販売中</option>
          <option value="sold">未発送</option>
          <option value="shipped">発送済み</option>
        </select>
      </div>
    </div>
    <div id="editSaleArea" style="display:none">
      <div class="form-grid">
        <div><label>売れた日</label><input id="eSoldDate" type="date"></div>
        <div><label>販売先</label>
          <select id="ePlatform" onchange="refreshShipOptions('e');calcEditPreview()">
            <option value="mercari">メルカリ</option>
            <option value="yahoo-flea">Yahoo!フリマ</option>
            <option value="yahoo-auction">ヤフオク</option>
            <option value="other">その他</option>
          </select>
        </div>
      </div>
      <div class="form-grid one"><div><label>販売価格</label><input id="ePrice" type="number" inputmode="numeric" oninput="calcEditPreview()"></div></div>
      <div class="form-grid">
        <div><label>発送方法</label><select id="eShipMethod" onchange="applyShipFee('e');calcEditPreview()"></select></div>
        <div><label>送料</label><input id="eShip" type="number" inputmode="numeric" oninput="calcEditPreview()"></div>
      </div>
      <div class="form-grid one"><div><label>梱包費・その他</label><input id="eMisc" type="number" inputmode="numeric" oninput="calcEditPreview()"></div></div>
      <div class="preview" id="editPreview"></div>
    </div>
    <div class="form-grid one"><div><label>メモ</label><textarea id="eMemo"></textarea></div></div>
    <button class="btn btn-primary full" onclick="saveEdit()">保存する</button>
    <button class="btn btn-danger full" style="margin-top:9px" onclick="deleteCurrentEdit()">この商品を削除</button>
  </div>
</div>

<!-- 詳細 -->
<div class="modal" id="detailModal">
  <div class="modal-box">
    <div class="modal-head"><h2 id="detailTitle">詳細</h2><button class="close" onclick="closeModal('detailModal')">×</button></div>
    <div id="detailContent"></div>
  </div>
</div>

<!-- 送料 -->
<div class="modal" id="shipModal">
  <div class="modal-box">
    <div class="modal-head"><h2>送料早見表</h2><button class="close" onclick="closeModal('shipModal')">×</button></div>
    <div id="shipTable"></div>
    <div class="note" style="margin-top:10px">料金改定の可能性があるため、発送前には各サービスの画面でも確認してください。送料は手入力で上書きできます。</div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const CATS=['レトロゲーム','トレカ','ブランド品','古着','電子機器','本・漫画','おもちゃ','その他'];
const SOURCES=['不用品','ハードオフ','ブックオフ','メルカリ','ヤフオク','リサイクルショップ','フリマ','その他'];
const PLATFORM_NAME={mercari:'メルカリ','yahoo-flea':'Yahoo!フリマ','yahoo-auction':'ヤフオク',other:'その他'};
const PLATFORM_FEE={mercari:.10,'yahoo-flea':.05,'yahoo-auction':.10,other:.10};

const SHIPPING_METHODS=[
 {id:'manual',group:'all',name:'手入力',fee:null},
 {id:'none',group:'all',name:'送料0・手渡し',fee:0},
 {id:'mercari_mini',group:'mercari',name:'ゆうパケットポストmini',fee:160},
 {id:'mercari_nekopos',group:'mercari',name:'ネコポス',fee:210},
 {id:'mercari_post',group:'mercari',name:'ゆうパケットポスト',fee:215},
 {id:'mercari_packet',group:'mercari',name:'ゆうパケット',fee:230},
 {id:'mercari_compact',group:'mercari',name:'宅急便コンパクト',fee:450},
 {id:'mercari_plus',group:'mercari',name:'ゆうパケットプラス',fee:455},
 {id:'mercari_60',group:'mercari',name:'宅急便／ゆうパック 60',fee:750},
 {id:'mercari_80_yamato',group:'mercari',name:'宅急便 80',fee:850},
 {id:'mercari_80_post',group:'mercari',name:'ゆうパック 80',fee:870},
 {id:'mercari_100_yamato',group:'mercari',name:'宅急便 100',fee:1050},
 {id:'mercari_100_post',group:'mercari',name:'ゆうパック 100',fee:1070},
 {id:'mercari_120',group:'mercari',name:'宅急便／ゆうパック 120',fee:1200},
 {id:'mercari_140',group:'mercari',name:'宅急便／ゆうパック 140',fee:1450},
 {id:'mercari_160',group:'mercari',name:'宅急便／ゆうパック 160',fee:1700},
 {id:'mercari_post170',group:'mercari',name:'ゆうパック 170',fee:1900},
 {id:'mercari_yamato180',group:'mercari',name:'宅急便 180',fee:2100},
 {id:'mercari_yamato200',group:'mercari',name:'宅急便 200',fee:2500},
 {id:'yahoo_mini',group:'yahoo',name:'ゆうパケットポストmini',fee:160},
 {id:'yahoo_nekopos',group:'yahoo',name:'ネコポス',fee:210},
 {id:'yahoo_post',group:'yahoo',name:'ゆうパケットポスト',fee:210},
 {id:'yahoo_packet',group:'yahoo',name:'ゆうパケット',fee:230},
 {id:'yahoo_compact',group:'yahoo',name:'宅急便コンパクト(EAZY)',fee:450},
 {id:'yahoo_plus',group:'yahoo',name:'ゆうパケットプラス',fee:440},
 {id:'yahoo_60',group:'yahoo',name:'宅急便／ゆうパック 60',fee:750},
 {id:'yahoo_80',group:'yahoo',name:'宅急便／ゆうパック 80',fee:850},
 {id:'yahoo_100',group:'yahoo',name:'宅急便／ゆうパック 100',fee:1050},
 {id:'yahoo_120',group:'yahoo',name:'宅急便／ゆうパック 120',fee:1200},
 {id:'yahoo_140',group:'yahoo',name:'宅急便／ゆうパック 140',fee:1400},
 {id:'yahoo_160',group:'yahoo',name:'宅急便／ゆうパック 160',fee:1700},
 {id:'yahoo_170',group:'yahoo',name:'ゆうパック 170',fee:1900},
 {id:'other',group:'all',name:'普通郵便・その他',fee:null}
];

let items=[];
let stockType='sedori';
let stockStatus='selling';
let analysisType='all';
let viewMonth=new Date();

function today(){return new Date().toISOString().slice(0,10)}
function monthKey(d){return d.toISOString().slice(0,7)}
function yen(n){return '¥'+Math.round(Number(n)||0).toLocaleString('ja-JP')}
function safeNum(v){return Number(v)||0}
function feeRate(platform){return PLATFORM_FEE[platform] ?? .10}
function feeOf(item){
  const price=safeNum(item.actualPrice || item.price);
  return Math.floor(price * (item.feeRate ?? feeRate(item.platform)));
}
function profitOf(item){
  return safeNum(item.actualPrice || item.price)-feeOf(item)-safeNum(item.cost)-safeNum(item.ship)-safeNum(item.misc);
}
function roiOf(item){
  return safeNum(item.cost)>0 ? Math.round(profitOf(item)/safeNum(item.cost)*100) : 0;
}
function isSold(item){return ['sold','shipped'].includes(item.status) && safeNum(item.actualPrice||item.price)>0}
function typeMatches(item,type){return type==='all'||item.type===type}
function statusText(status){return status==='sold'?'未発送':status==='shipped'?'発送済み':'販売中'}
function shipName(id){return SHIPPING_METHODS.find(x=>x.id===id)?.name||'手入力'}

function toast(text){
  const el=$('toast'); el.textContent=text; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),1600);
}
function save(){
  localStorage.setItem('sedori_items',JSON.stringify(items));
  $('saveState').textContent='保存済み';
}
function load(){
  try{items=JSON.parse(localStorage.getItem('sedori_items')||'[]')}catch{items=[]}
  normalizeAll();
}
function normalizeAll(){
  const now=Date.now();
  items=items.map((raw,index)=>{
    const n={...raw};
    n.id=n.id || now+index;
    n.name=n.name || '無題';
    n.cat=n.cat || 'その他';
    n.source=n.source || 'その他';
    n.cost=safeNum(n.cost);
    n.ship=safeNum(n.ship);
    n.misc=safeNum(n.misc);
    n.date=n.date || today();
    n.platform=n.platform || 'mercari';
    n.feeRate=Number.isFinite(Number(n.feeRate)) ? Number(n.feeRate) : feeRate(n.platform);
    n.actualPrice=safeNum(n.actualPrice!==undefined?n.actualPrice:n.price);
    n.price=n.actualPrice;
    n.type=(n.type==='sedori'||n.type==='fuyohin')?n.type:(n.source==='不用品'?'fuyohin':'sedori');

    if(isSold(n)){
      n.status=n.status==='shipped'?'shipped':'sold';
      n.soldDate=n.soldDate||today();
    }else{
      n.status='listed';
      n.soldDate='';
      n.actualPrice=0;n.price=0;n.ship=0;n.misc=0;
    }
    n.shipMethod=n.shipMethod||guessShipMethod(n);
    n.memo=n.memo||'';
    return n;
  });
  save();
}
function guessShipMethod(item){
  if(!safeNum(item.ship))return 'manual';
  const group=(item.platform||'').startsWith('yahoo')?'yahoo':'mercari';
  return SHIPPING_METHODS.find(x=>(x.group===group||x.group==='all')&&x.fee===safeNum(item.ship))?.id||'manual';
}
function fillSelect(id,values,includeAll=false){
  $(id).innerHTML=(includeAll?'<option value="all">すべて</option>':'')+values.map(v=>`<option value="${v}">${v}</option>`).join('');
}
function init(){
  load();
  ['aCat','eCat'].forEach(id=>fillSelect(id,CATS));
  ['aSource','eSource'].forEach(id=>fillSelect(id,SOURCES));
  fillSelect('stockCat',CATS,true);
  $('aDate').value=today();
  $('sDate').value=today();
  renderAll();
}
function renderAll(){renderStock();renderAnalysis();renderData()}
function showPage(id,button){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  $(id).classList.add('active'); button?.classList.add('active');
  $('addButton').style.display=id==='stock'?'block':'none';
  if(id==='analysis')renderAnalysis();
  if(id==='data')renderData();
}
function activate(parent,button){
  document.querySelectorAll(`#${parent} button`).forEach(x=>x.classList.remove('active'));
  button.classList.add('active');
}
function setStockType(type,button){stockType=type;activate('stockTypeTabs',button);renderStock()}
function setStockStatus(status,button){stockStatus=status;activate('stockStatusTabs',button);renderStock()}
function setAnalysisType(type,button){analysisType=type;activate('analysisTypeTabs',button);renderAnalysis()}
function toggleFilter(){$('filterBox').classList.toggle('open')}
function resetFilter(){$('stockCat').value='all';$('stockSort').value='new';renderStock()}

function renderStock(){
  const query=$('searchInput').value.trim().toLowerCase();
  const cat=$('stockCat').value||'all';
  const sort=$('stockSort').value||'new';

  let arr=items.filter(i=>typeMatches(i,stockType));
  if(stockStatus==='selling')arr=arr.filter(i=>!isSold(i));
  if(stockStatus==='waiting')arr=arr.filter(i=>i.status==='sold');
  if(stockStatus==='history')arr=arr.filter(i=>i.status==='shipped');
  if(query)arr=arr.filter(i=>(i.name+' '+i.cat+' '+i.source+' '+i.memo).toLowerCase().includes(query));
  if(cat!=='all')arr=arr.filter(i=>i.cat===cat);

  arr.sort((a,b)=>{
    if(sort==='old')return (a.date||'').localeCompare(b.date||'');
    if(sort==='profit')return profitOf(b)-profitOf(a);
    if(sort==='price')return safeNum(b.actualPrice||b.price)-safeNum(a.actualPrice||a.price);
    const da=(a.soldDate||a.date||''),db=(b.soldDate||b.date||'');
    return db.localeCompare(da);
  });

  $('stockCount').textContent=`${arr.length}件`;
  $('stockList').innerHTML=arr.length?arr.map(itemCard).join(''):'<div class="empty">該当する商品はありません</div>';
}
function itemCard(i){
  const sold=isSold(i);
  const stateClass=i.status==='sold'?'wait':i.status==='shipped'?'done':'selling';
  const right=sold?`<div class="item-price ${profitOf(i)>=0?'green':'red'}">${yen(profitOf(i))}</div>`:`<div class="item-price">${yen(i.cost)}</div>`;
  const meta=sold
    ? `売上 ${yen(i.actualPrice||i.price)} ／ 送料 ${yen(i.ship)} ／ ${i.soldDate||'-'}`
    : `仕入れ ${yen(i.cost)} ／ ${i.date||'-'} ／ ${i.source}`;
  const action=i.status==='listed'
    ? `<button class="btn btn-green" onclick="openSold('${i.id}')">売れた</button><button class="btn" onclick="openEdit('${i.id}')">編集</button>`
    : i.status==='sold'
      ? `<button class="btn btn-blue" onclick="markShipped('${i.id}')">発送済みにする</button><button class="btn" onclick="openEdit('${i.id}')">編集</button>`
      : `<button class="btn" onclick="openEdit('${i.id}')">編集</button><button class="btn" onclick="openItemDetail('${i.id}')">詳細</button>`;
  return `<div class="item">
    <div class="item-top"><div><div class="item-name">${escapeHtml(i.name)}</div><div class="badges"><span class="badge ${stateClass}">${statusText(i.status)}</span><span class="badge">${escapeHtml(i.cat)}</span></div></div>${right}</div>
    <div class="item-meta">${meta}</div>
    <div class="item-actions">${action}</div>
  </div>`;
}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}

function openAdd(){
  $('aType').value=stockType;
  $('aName').value='';$('aCost').value='';$('aMemo').value='';$('aDate').value=today();
  $('aCat').value=CATS[0];$('aSource').value=stockType==='fuyohin'?'不用品':SOURCES[1];
  $('addModal').classList.add('open');
}
function addItem(){
  const name=$('aName').value.trim();
  if(!name){toast('商品名を入力してください');return}
  const item={
    id:Date.now(),name,type:$('aType').value,cat:$('aCat').value,source:$('aSource').value,
    cost:safeNum($('aCost').value),date:$('aDate').value||today(),memo:$('aMemo').value.trim(),
    status:'listed',actualPrice:0,price:0,soldDate:'',ship:0,misc:0,platform:'mercari',feeRate:.10,shipMethod:'manual'
  };
  items.unshift(item);save();closeModal('addModal');stockType=item.type;syncStockTypeTabs();stockStatus='selling';syncStockStatusTabs();renderAll();toast('登録しました');
}
function syncStockTypeTabs(){
  document.querySelectorAll('#stockTypeTabs button').forEach((b,idx)=>b.classList.toggle('active',(idx===0&&stockType==='sedori')||(idx===1&&stockType==='fuyohin')));
}
function syncStockStatusTabs(){
  const map=['selling','waiting','history'];
  document.querySelectorAll('#stockStatusTabs button').forEach((b,idx)=>b.classList.toggle('active',map[idx]===stockStatus));
}

function openSold(id){
  const i=items.find(x=>String(x.id)===String(id));if(!i)return;
  $('soldId').value=i.id;$('soldName').textContent=i.name;$('sDate').value=today();$('sPlatform').value='mercari';
  $('sPrice').value='';$('sShip').value='';$('sMisc').value=0;refreshShipOptions('s');calcSoldPreview();
  $('soldModal').classList.add('open');
}
function refreshShipOptions(prefix){
  const platform=$(prefix+'Platform').value;
  const group=platform.startsWith('yahoo')?'yahoo':platform==='mercari'?'mercari':'all';
  const select=$(prefix+'ShipMethod');
  select.innerHTML=SHIPPING_METHODS.filter(x=>x.group==='all'||x.group===group).map(x=>`<option value="${x.id}">${x.name}${x.fee===null?'':`（${yen(x.fee)}）`}</option>`).join('');
}
function applyShipFee(prefix){
  const method=SHIPPING_METHODS.find(x=>x.id===$(prefix+'ShipMethod').value);
  if(method&&method.fee!==null)$(prefix+'Ship').value=method.fee;
}
function calcPreview(price,cost,platform,ship,misc){
  const fee=Math.floor(safeNum(price)*feeRate(platform));
  const profit=safeNum(price)-fee-safeNum(cost)-safeNum(ship)-safeNum(misc);
  const roi=safeNum(cost)>0?Math.round(profit/safeNum(cost)*100):0;
  return {fee,profit,roi};
}
function calcSoldPreview(){
  const i=items.find(x=>String(x.id)===String($('soldId').value));
  const p=calcPreview($('sPrice').value,i?.cost||0,$('sPlatform').value,$('sShip').value,$('sMisc').value);
  $('soldPreview').innerHTML=previewHtml(p,i?.cost||0,$('sShip').value,$('sMisc').value);
}
function previewHtml(p,cost,ship,misc){
  return `<div class="preview-row"><span>販売手数料</span><b>${yen(p.fee)}</b></div>
  <div class="preview-row"><span>仕入れ値</span><b>${yen(cost)}</b></div>
  <div class="preview-row"><span>送料・その他</span><b>${yen(safeNum(ship)+safeNum(misc))}</b></div>
  <div class="preview-row"><span>利益</span><b class="${p.profit>=0?'green':'red'}">${yen(p.profit)}</b></div>
  <div class="preview-row"><span>ROI</span><b>${p.roi}%</b></div>`;
}
function saveSold(){
  const i=items.find(x=>String(x.id)===String($('soldId').value));if(!i)return;
  const price=safeNum($('sPrice').value);if(price<=0){toast('販売価格を入力してください');return}
  i.status='sold';i.soldDate=$('sDate').value||today();i.actualPrice=price;i.price=price;
  i.platform=$('sPlatform').value;i.feeRate=feeRate(i.platform);i.ship=safeNum($('sShip').value);
  i.misc=safeNum($('sMisc').value);i.shipMethod=$('sShipMethod').value;
  save();closeModal('soldModal');stockStatus='waiting';syncStockStatusTabs();renderAll();toast('売れた記録を保存しました');
}
function markShipped(id){
  const i=items.find(x=>String(x.id)===String(id));if(!i)return;
  i.status='shipped';save();renderAll();toast('発送済みにしました');
}

function openEdit(id){
  const i=items.find(x=>String(x.id)===String(id));if(!i)return;
  $('eId').value=i.id;$('eType').value=i.type;$('eDate').value=i.date;$('eName').value=i.name;$('eCat').value=i.cat;
  $('eSource').value=i.source;$('eCost').value=i.cost;$('eStatus').value=i.status;$('eMemo').value=i.memo||'';
  $('eSoldDate').value=i.soldDate||today();$('ePlatform').value=i.platform||'mercari';$('ePrice').value=i.actualPrice||i.price||'';
  refreshShipOptions('e');
  $('eShipMethod').value=[...$('eShipMethod').options].some(o=>o.value===i.shipMethod)?i.shipMethod:'manual';
  $('eShip').value=i.ship||0;$('eMisc').value=i.misc||0;toggleEditSale();$('editModal').classList.add('open');
}
function toggleEditSale(){
  $('editSaleArea').style.display=['sold','shipped'].includes($('eStatus').value)?'block':'none';
  calcEditPreview();
}
function calcEditPreview(){
  const p=calcPreview($('ePrice').value,$('eCost').value,$('ePlatform').value,$('eShip').value,$('eMisc').value);
  $('editPreview').innerHTML=previewHtml(p,$('eCost').value,$('eShip').value,$('eMisc').value);
}
function saveEdit(){
  const i=items.find(x=>String(x.id)===String($('eId').value));if(!i)return;
  i.name=$('eName').value.trim()||i.name;i.type=$('eType').value;i.date=$('eDate').value||today();
  i.cat=$('eCat').value;i.source=$('eSource').value;i.cost=safeNum($('eCost').value);i.status=$('eStatus').value;i.memo=$('eMemo').value.trim();
  if(['sold','shipped'].includes(i.status)){
    i.soldDate=$('eSoldDate').value||today();i.platform=$('ePlatform').value;i.feeRate=feeRate(i.platform);
    i.actualPrice=safeNum($('ePrice').value);i.price=i.actualPrice;i.ship=safeNum($('eShip').value);
    i.misc=safeNum($('eMisc').value);i.shipMethod=$('eShipMethod').value;
    if(i.actualPrice<=0){toast('販売価格を入力してください');return}
  }else{
    i.status='listed';i.soldDate='';i.actualPrice=0;i.price=0;i.ship=0;i.misc=0;i.shipMethod='manual';
  }
  save();closeModal('editModal');renderAll();toast('保存しました');
}
function deleteCurrentEdit(){
  const id=$('eId').value;if(!confirm('この商品を削除しますか？'))return;
  items=items.filter(x=>String(x.id)!==String(id));save();closeModal('editModal');renderAll();toast('削除しました');
}

function soldItems(type='all'){return items.filter(i=>typeMatches(i,type)&&isSold(i))}
function summarize(arr){
  const s={count:arr.length,sales:0,cost:0,fee:0,ship:0,misc:0,profit:0};
  arr.forEach(i=>{s.sales+=safeNum(i.actualPrice||i.price);s.cost+=safeNum(i.cost);s.fee+=feeOf(i);s.ship+=safeNum(i.ship);s.misc+=safeNum(i.misc);s.profit+=profitOf(i)});
  s.roi=s.cost>0?Math.round(s.profit/s.cost*100):0;
  return s;
}
function summaryCard(label,value,color,key,sub='タップで詳細'){
  return `<button class="summary-card" onclick="openSummaryDetail('${key}')"><div class="label">${label}</div><div class="value ${color}">${value}</div><div class="sub">${sub}</div></button>`;
}
function renderAnalysis(){
  const ym=monthKey(viewMonth);$('analysisMonth').textContent=ym;
  const month=soldItems(analysisType).filter(i=>(i.soldDate||'').startsWith(ym));
  const total=soldItems(analysisType);
  const m=summarize(month),t=summarize(total);
  $('analysisSummary').innerHTML=
    summaryCard('今月利益',yen(m.profit),m.profit>=0?'green':'red','monthProfit')+
    summaryCard('今月売上',yen(m.sales),'orange','monthSales')+
    summaryCard('販売数',m.count+'件','blue','monthCount')+
    summaryCard('ROI',m.roi+'%','green','monthRoi');
  $('totalSummary').innerHTML=
    summaryCard('累計利益',yen(t.profit),t.profit>=0?'green':'red','totalProfit')+
    summaryCard('累計売上',yen(t.sales),'orange','totalSales')+
    summaryCard('累計販売数',t.count+'件','blue','totalCount')+
    summaryCard('累計ROI',t.roi+'%','green','totalRoi');
  renderMonthlyTable();renderPlatformTable();
}
function moveMonth(n){viewMonth.setMonth(viewMonth.getMonth()+n);renderAnalysis()}
function groupBy(arr,keyFn){
  const out={};arr.forEach(i=>{const k=keyFn(i)||'未設定';(out[k]||(out[k]=[])).push(i)});return out;
}
function renderMonthlyTable(){
  const groups=groupBy(soldItems(analysisType),i=>(i.soldDate||'').slice(0,7));
  const rows=Object.keys(groups).sort().reverse().slice(0,12).map(k=>({k,...summarize(groups[k])}));
  $('monthlyTable').innerHTML=rows.length?`<table><tr><th>月</th><th>売上</th><th>利益</th><th>件数</th></tr>${rows.map(r=>`<tr><td>${r.k}</td><td>${yen(r.sales)}</td><td class="${r.profit>=0?'green':'red'}">${yen(r.profit)}</td><td>${r.count}</td></tr>`).join('')}</table>`:'<div class="empty">データなし</div>';
}
function renderPlatformTable(){
  const groups=groupBy(soldItems(analysisType),i=>PLATFORM_NAME[i.platform]||'その他');
  const rows=Object.keys(groups).map(k=>({k,...summarize(groups[k])})).sort((a,b)=>b.sales-a.sales);
  $('platformTable').innerHTML=rows.length?`<table><tr><th>販売先</th><th>売上</th><th>利益</th><th>件数</th></tr>${rows.map(r=>`<tr><td>${r.k}</td><td>${yen(r.sales)}</td><td class="${r.profit>=0?'green':'red'}">${yen(r.profit)}</td><td>${r.count}</td></tr>`).join('')}</table>`:'<div class="empty">データなし</div>';
}
function openSummaryDetail(key){
  const ym=monthKey(viewMonth);
  const monthly=key.startsWith('month');
  const arr=soldItems(analysisType).filter(i=>!monthly||(i.soldDate||'').startsWith(ym)).sort((a,b)=>(b.soldDate||'').localeCompare(a.soldDate||''));
  const s=summarize(arr);
  $('detailTitle').textContent=monthly?`${ym} の詳細`:'累計の詳細';
  $('detailContent').innerHTML=`<div class="detail-summary"><div class="note">利益</div><div class="big ${s.profit>=0?'green':'red'}">${yen(s.profit)}</div><div class="note">売上 ${yen(s.sales)} ／ 仕入れ ${yen(s.cost)} ／ 手数料 ${yen(s.fee)} ／ 送料 ${yen(s.ship)} ／ その他 ${yen(s.misc)} ／ ${s.count}件</div></div>`+
    (arr.length?arr.map(detailRow).join(''):'<div class="empty">データなし</div>');
  $('detailModal').classList.add('open');
}
function openItemDetail(id){
  const i=items.find(x=>String(x.id)===String(id));if(!i)return;
  $('detailTitle').textContent=i.name;
  $('detailContent').innerHTML=`<div class="detail-summary">
    <div class="preview-row"><span>状態</span><b>${statusText(i.status)}</b></div>
    <div class="preview-row"><span>販売価格</span><b>${yen(i.actualPrice||i.price)}</b></div>
    <div class="preview-row"><span>仕入れ値</span><b>${yen(i.cost)}</b></div>
    <div class="preview-row"><span>手数料</span><b>${yen(feeOf(i))}</b></div>
    <div class="preview-row"><span>送料</span><b>${yen(i.ship)}</b></div>
    <div class="preview-row"><span>その他</span><b>${yen(i.misc)}</b></div>
    <div class="preview-row"><span>利益</span><b class="${profitOf(i)>=0?'green':'red'}">${yen(profitOf(i))}</b></div>
    <div class="preview-row"><span>発送方法</span><b>${escapeHtml(shipName(i.shipMethod))}</b></div>
  </div>`;
  $('detailModal').classList.add('open');
}
function detailRow(i){
  return `<div class="item" style="margin-bottom:8px"><div class="item-top"><div class="item-name">${escapeHtml(i.name)}</div><div class="item-price ${profitOf(i)>=0?'green':'red'}">${yen(profitOf(i))}</div></div><div class="item-meta">${i.soldDate||'-'} ／ 売上 ${yen(i.actualPrice||i.price)} ／ 送料 ${yen(i.ship)}</div></div>`;
}

function renderData(){
  const sold=soldItems('all').length;
  $('dataCount').textContent=`全${items.length}件・販売済み${sold}件`;
}
function makeCSV(){
  const start=$('csvStart').value,end=$('csvEnd').value;
  const arr=[...items].filter(i=>{
    const d=(isSold(i)?i.soldDate:i.date)||'';const m=d.slice(0,7);
    return (!start||m>=start)&&(!end||m<=end);
  });
  const head=['商品名','種別','カテゴリ','仕入れ先','登録日','状態','売れた日','売上','仕入れ値','手数料','送料','その他','利益','ROI','販売先','発送方法','メモ'];
  const rows=arr.map(i=>[i.name,i.type==='fuyohin'?'不用品':'せどり',i.cat,i.source,i.date,statusText(i.status),i.soldDate,i.actualPrice||i.price,i.cost,feeOf(i),i.ship,i.misc,profitOf(i),roiOf(i),PLATFORM_NAME[i.platform]||'',shipName(i.shipMethod),i.memo]);
  return [head,...rows].map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
}
function downloadCSV(){downloadBlob(new Blob(['\ufeff'+makeCSV()],{type:'text/csv'}),`sedori_${today()}.csv`);toast('CSVを保存しました')}
function downloadBackup(){
  const data={version:'2026-07-simple',items,exportedAt:new Date().toISOString()};
  downloadBlob(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),`sedori_backup_${today()}.json`);
  toast('バックアップを保存しました');
}
function restoreBackup(event){
  const file=event.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);const next=Array.isArray(data)?data:data.items;
      if(!Array.isArray(next))throw new Error();
      if(!confirm('現在のデータを上書きして復元しますか？'))return;
      items=next;normalizeAll();renderAll();toast('復元しました');
    }catch{toast('復元できませんでした')}
  };
  r.readAsText(file);
}
function downloadBlob(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function deleteAll(){
  if(!confirm('全データを削除しますか？'))return;
  if(!confirm('本当に削除します。バックアップは保存しましたか？'))return;
  items=[];save();renderAll();toast('全データを削除しました');
}
function openShipping(){
  const groups=[['mercari','メルカリ'],['yahoo','Yahoo!フリマ・ヤフオク']];
  $('shipTable').innerHTML=groups.map(([group,title])=>{
    const rows=SHIPPING_METHODS.filter(x=>x.group===group);
    return `<div class="section-title" style="margin:12px 0 6px">${title}</div><div class="table-wrap"><table><tr><th>発送方法</th><th>送料</th></tr>${rows.map(x=>`<tr><td>${x.name}</td><td>${x.fee===null?'手入力':yen(x.fee)}</td></tr>`).join('')}</table></div>`;
  }).join('');
  $('shipModal').classList.add('open');
}
function closeModal(id){$(id).classList.remove('open')}

document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open')}));
init();
</script>
</body>
